name: CI

on:
  workflow_call:
    inputs:
      RUNNER:
        required: false
        type: string
        description: Optional self-hosted runner for this workflow (see https://github.com/TorqIT/pimcore-github-actions-workflows#self-hosted-runners)
      PROJECT_REPOSITORY:
        required: false
        default: "${{ github.repository }}"
        type: string
        description: "The GitHub repository of the project containing Pimcore"
      PROJECT_REPOSITORY_REF:
        required: false
        default: "${{ github.head_ref }}"
        type: string
        description: "The Git reference (branch, tag, commit SHA) to checkout from the project repository"
      NPM_BUILD:
        required: false
        type: boolean
        description: "Whether an NPM build should be run prior to building the PHP image"
      NPM_RUN_CMD:
        required: false
        type: string
        default: "build"
        description: "The NPM command that should be run prior to building the PHP image"
      NPM_SPA:
        required: false
        type: boolean
        description: "Whether the NPM build results in a single-page application"
      SPA_TWIG:
        required: false
        type: string
        default: "default/default.html.twig"
        description: "The path to the Twig file where the result of the NPM single-page application build should be copied"
      FRONTEND_ROOT:
        required: false
        type: string
        default: "frontend"
        description: "The path (relative to the project's root) where frontend files are stored"
      SUBMODULES:
        required: false
        type: boolean
        default: false
        description: "Whether to clone submodules when cloning the project repository"
      BUILD_TIME_ARGS:
        required: false
        type: string
        default: "{}"
        description: "A JSON object containing Docker build-time args in key: value format"
      PIMCORE_ROOT:
        required: false
        type: string
        default: "."
        description: "The path (relative to the project's root) in which the Pimcore files are stored (e.g. config, src, etc)"
      INIT:
        required: false
        type: boolean
        default: true
        description: "Whether the project uses an init container"
      INIT_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the init image"
      INIT_DOCKER_TARGET:
        required: false
        type: string
        default: "init"
        description: "The Docker target to use when building the init image"
      PHP_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the PHP image"
      PHP_DOCKER_TARGET:
        required: false
        type: string
        default: "php"
        description: "The Docker target to use when building the PHP image"
      SUPERVISORD_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the supervisord image"
      SUPERVISORD_TARGET:
        required: false
        type: string
        default: "supervisord"
        description: "The Docker target to use when building the supervisord image"
      RUN_UNIT_TESTS:
        required: false
        type: boolean
        default: false
        description: "Whether to run unit tests. Default: false, but will be true in future versions"
      UNIT_TESTS_DIRECTORY:
        required: false
        type: string
        default: "tests"
        description: "The directory where unit tests are located - note this should be relative to the Pimcore root, as once inside the container the working directory is set to the Pimcore root"
      GITHUB_APP_CHECKOUT:
        required: false
        type: boolean
        default: false
        description: "Whether to use a GitHub App token for checking out the project repository and submodules"
      POST_SCAN_RESULTS_TO_PR:
        required: false
        type: boolean
        default: false
        description: "Whether to post vulnerability scan results to the associated PR"

    secrets:
      BUILD_TIME_SECRETS:
        required: false
        description: A JSON object of secrets required at build-time (see above for example format)
      PIMCORE_ENTERPRISE_TOKEN:
        required: false
        description: (Optional) The value of your project's Pimcore Enterprise Token
      PIMCORE_PRODUCT_KEY:
        required: false
        description: (Optional) The Pimcore product key for the project
      PIMCORE_INSTANCE_IDENTIFIER:
        required: false
        description: (Optional) The Pimcore instance identifier for the project
      PIMCORE_ENCRYPTION_SECRET:
        required: false
        description: (Optional) The Pimcore encryption secret for the project
      TORQ_GITHUB_TOKEN:
        required: false
        description: (Optional) A GitHub access token used to access private GitHub repositories
      RECAPTCHA_CLIENT_KEY:
        required: false
        description: (Optional) A client key used when building NPM frontends that require ReCAPTCHA
      GITHUB_APP_ID:
        required: false
        description: The ID of the GitHub App used to generate a token for checking out the project repository and submodules
      GITHUB_APP_PRIVATE_KEY:
        required: false
        description: The private key of the GitHub App used to generate a token for checking out the project repository and submodules

jobs:
  lint:
    name: Lint files
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Lint all files
        uses: ./reusable-workflow/.github/actions/lint

  vulnerability-scan:
    name: Scan for vulnerabilities in dependencies and code (SCA and SAST)
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    outputs:
      npm-outcome: ${{ steps.npm-scan.outcome }}
      composer-outcome: ${{ steps.composer-scan.outcome }}
      semgrep-outcome: ${{ steps.semgrep-scan.outcome }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Scan for npm vulnerabilities
        id: npm-scan
        continue-on-error: true
        run: |
          result=0
          > /tmp/npm-audit.txt
          while IFS= read -r -d '' f; do
            echo "--- Scanning $(dirname "$f") ---" | tee -a /tmp/npm-audit.txt
            npm audit --audit-level=high --prefix "$(dirname "$f")" 2>&1 | tee -a /tmp/npm-audit.txt
            [ "${PIPESTATUS[0]}" -eq 0 ] || result=1
          done < <(find . -name "package-lock.json" -not -path "*/node_modules/*" -print0)
          exit $result

      - name: Scan for composer vulnerabilities
        id: composer-scan
        continue-on-error: true
        run: |
          set -o pipefail
          {
            if [[ -n "${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}" ]]; then
              composer --working-dir=${{ inputs.PIMCORE_ROOT }} config --global --auth http-basic.repo.pimcore.com token "${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}"
            fi
            if [ ! -f "${{ inputs.PIMCORE_ROOT }}/composer.lock" ]; then
              composer --working-dir=${{ inputs.PIMCORE_ROOT }} install --prefer-dist --no-scripts --ignore-platform-reqs
            fi
            composer --working-dir=${{ inputs.PIMCORE_ROOT }} audit --abandoned=ignore --locked
          } 2>&1 | tee /tmp/composer-audit.txt

      - name: Run Semgrep SAST scan
        id: semgrep-scan
        continue-on-error: true
        run: |
          pip install semgrep --quiet --break-system-packages
          semgrep scan \
            --config p/php \
            --config p/javascript \
            --config p/github-actions \
            --error \
            . 2>&1 | tee /tmp/semgrep.txt
          exit ${PIPESTATUS[0]}
        env:
          SEMGREP_SEND_METRICS: off

      - name: Upload scan results
        if: always()
        run: |
          mkdir -p scan-results
          cp /tmp/npm-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/composer-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/semgrep.txt scan-results/ 2>/dev/null || true

      - name: Upload scan results artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: scan-results/
          if-no-files-found: ignore

      - name: Fail if any scan found issues
        if: >-
          steps.npm-scan.outcome == 'failure' ||
          steps.composer-scan.outcome == 'failure' ||
          steps.semgrep-scan.outcome == 'failure'
        run: |
          echo "One or more vulnerability scans found issues - see PR comment for details"
          exit 1

  build:
    name: Build and scan ${{ matrix.name }} image
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: init
            dockerfile: ${{ inputs.INIT_DOCKERFILE }}
            target: ${{ inputs.INIT_DOCKER_TARGET }}
          - name: php
            dockerfile: ${{ inputs.PHP_DOCKERFILE }}
            target: ${{ inputs.PHP_DOCKER_TARGET }}
            npm_build: ${{ inputs.NPM_BUILD }}
            npm_spa: ${{ inputs.NPM_SPA }}
            spa_twig: ${{ inputs.SPA_TWIG }}
            frontend_root: ${{ inputs.FRONTEND_ROOT }}
            npm_run_cmd: ${{ inputs.NPM_RUN_CMD }}
          - name: supervisord
            dockerfile: ${{ inputs.SUPERVISORD_DOCKERFILE }}
            target: ${{ inputs.SUPERVISORD_TARGET }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Build ${{ matrix.name }} image
        uses: ./reusable-workflow/.github/actions/build-and-push-pimcore-image
        with:
          DOCKERFILE_TARGET: ${{ matrix.target }}
          DOCKERFILE_PATH: ${{ matrix.dockerfile }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}
          PIMCORE_ENTERPRISE_TOKEN: ${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
          PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
          PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
          TORQ_GITHUB_TOKEN: ${{ secrets.TORQ_GITHUB_TOKEN }}
          FRONTEND_ROOT: ${{ matrix.frontend_root }}
          NPM_BUILD: ${{ matrix.npm_build }}
          RECAPTCHA_CLIENT_KEY: ${{ secrets.RECAPTCHA_CLIENT_KEY }}
          NPM_SPA: ${{ matrix.npm_spa }}
          SPA_TWIG: ${{ matrix.spa_twig }}
          NPM_RUN_CMD: ${{ matrix.npm_run_cmd }}
          PUSH: false
          TAGS: "${{ matrix.name }}:ci-${{ github.run_id }}"

      - name: Run Trivy vulnerability scanner on image
        id: trivy-scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98 # v0.36.0
        with:
          image-ref: "${{ matrix.name }}:ci-${{ github.run_id }}"
          format: "table"
          output: "trivy-${{ matrix.name }}.txt"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results
        if: always()
        run: echo "${{ steps.trivy-scan.outcome }}" > trivy-${{ matrix.name }}-status.txt

      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.txt
            trivy-${{ matrix.name }}-status.txt
          if-no-files-found: ignore

      - name: Fail if Trivy found vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL or HIGH vulnerabilities in the ${{ matrix.name }} image"
          exit 1

  post-scan-report:
    name: Post security scan results to PR
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    needs: [vulnerability-scan, build]
    if: (success() || failure()) && github.event_name == 'pull_request' && inputs.POST_SCAN_RESULTS_TO_PR
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Post security scan results
        uses: ./reusable-workflow/.github/actions/post-scan-report
        with:
          NPM_OUTCOME: ${{ needs.vulnerability-scan.outputs.npm-outcome }}
          COMPOSER_OUTCOME: ${{ needs.vulnerability-scan.outputs.composer-outcome }}
          SEMGREP_OUTCOME: ${{ needs.vulnerability-scan.outputs.semgrep-outcome }}
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-unit-tests:
    name: Run unit tests
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    if: ${{ inputs.RUN_UNIT_TESTS }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Run unit tests
        uses: ./reusable-workflow/.github/actions/run-unit-tests
        with:
          DOCKERFILE: ${{ inputs.INIT && inputs.INIT_DOCKERFILE || inputs.PHP_DOCKERFILE }}
          DOCKERFILE_TARGET: ${{ inputs.INIT && inputs.INIT_DOCKER_TARGET || inputs.PHP_DOCKER_TARGET }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}
          PIMCORE_ENTERPRISE_TOKEN: ${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
          PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
          PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
          TORQ_GITHUB_TOKEN: ${{ secrets.TORQ_GITHUB_TOKEN }}
          UNIT_TESTS_DIRECTORY: ${{ inputs.UNIT_TESTS_DIRECTORY }}
