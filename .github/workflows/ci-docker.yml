name: CI

on:
  workflow_call:
    inputs:
      RUNNER:
        required: false
        type: string
        description: Optional self-hosted runner for this workflow (see https://github.com/TorqIT/pimcore-github-actions-workflows#self-hosted-runners)
      PROJECT_REPOSITORY:
        required: false
        default: "${{ github.repository }}"
        type: string
        description: "The GitHub repository of the project containing Pimcore"
      PROJECT_REPOSITORY_REF:
        required: false
        default: "${{ github.head_ref }}"
        type: string
        description: "The Git reference (branch, tag, commit SHA) to checkout from the project repository"
      CONTAINER_REGISTRY:
        required: false
        type: string
        description: "Docker container registry to push images to - if left empty, images will not be pushed anywhere"
      NPM_BUILD:
        required: false
        type: boolean
        description: "Whether an NPM build should be run prior to building the PHP image"
      NPM_RUN_CMD:
        required: false
        type: string
        default: "build"
        description: "The NPM command that should be run prior to building the PHP image"
      NPM_SPA:
        required: false
        type: boolean
        description: "Whether the NPM build results in a single-page application"
      SPA_TWIG:
        required: false
        type: string
        default: "default/default.html.twig"
        description: "The path to the Twig file where the result of the NPM single-page application build should be copied"
      FRONTEND_ROOT:
        required: false
        type: string
        default: "frontend"
        description: "The path (relative to the project's root) where frontend files are stored"
      SUBMODULES:
        required: false
        type: boolean
        default: false
        description: "Whether to clone submodules when cloning the project repository"
      BUILD_TIME_ARGS:
        required: false
        type: string
        default: "{}"
        description: "A JSON object containing Docker build-time args in key: value format"
      PIMCORE_ROOT:
        required: false
        type: string
        default: "."
        description: "The path (relative to the project's root) in which the Pimcore files are stored (e.g. config, src, etc)"
      IMAGES_TAG:
        required: false
        type: string
        default: latest
        description: "Tag for built images (e.g. dev, test, prod). Images will be tagged with this as well as the run ID. If not provided, latest will be used"
      INIT:
        required: false
        type: boolean
        default: true
        description: "Whether the project uses an init container"
      INIT_IMAGE:
        required: false
        type: string
        default: "init"
        description: "Name of the init image"
      INIT_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the init image"
      INIT_DOCKER_TARGET:
        required: false
        type: string
        default: "init"
        description: "The Docker target to use when building the init image"
      PHP_IMAGE:
        required: false
        type: string
        default: "php"
        description: "Name of the PHP Pimcore image"
      PHP_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the PHP image"
      PHP_DOCKER_TARGET:
        required: false
        type: string
        default: "php"
        description: "The Docker target to use when building the PHP image"
      SUPERVISORD_IMAGE:
        required: false
        type: string
        default: "supervisord"
        description: "Name of the supervisord Pimcore image"
      SUPERVISORD_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the supervisord image"
      SUPERVISORD_TARGET:
        required: false
        type: string
        default: "supervisord"
        description: "The Docker target to use when building the supervisord image"
      RUN_UNIT_TESTS:
        required: false
        type: boolean
        default: false
        description: "Whether to run unit tests. Default: false, but will be true in future versions"
      UNIT_TESTS_DIRECTORY:
        required: false
        type: string
        default: "tests"
        description: "The directory where unit tests are located - note this should be relative to the Pimcore root, as once inside the container the working directory is set to the Pimcore root"
      GITHUB_APP_CHECKOUT:
        required: false
        type: boolean
        default: false
        description: "Whether to use a GitHub App token for checking out the project repository and submodules"
      POST_SCAN_RESULTS_TO_PR:
        required: false
        type: boolean
        default: false
        description: "Whether to post vulnerability scan results to the associated PR"
      TRIVYIGNORE_PATH:
        required: false
        type: string
        default: ""
        description: "Path to .trivyignore.yaml file (e.g. ./.trivyignore.yaml)"
      FEATURE_FLAG_INSTALL_MISSING_BUNDLES:
        required: false
        type: boolean
        default: false
        description: "Feature flag - whether to automatically install missing required Pimcore bundles (e.g. Azure Flysystem bundle). Will be removed and assumed true in a future release."
      FEATURE_FLAG_DISABLE_CONFIG_COPY:
        required: false
        type: boolean
        default: false
        description: "Feature flag - whether to disable copying of config files for Azure MySQL and Azure Storage. Will be removed and assumed true in a future release."
      AZURE_MYSQL:
        required: false
        type: boolean
        default: false
        description: "Whether the application uses an Azure MySQL server instance as its database"
      AZURE_STORAGE:
        required: false
        type: boolean
        default: false
        description: "Whether the application uses Azure Storage and Flysystem for its file storage"
      AZURE_TENANT_ID:
        required: false
        type: string
        description: ID of the Azure tenant to deploy to
      AZURE_SUBSCRIPTION_ID:
        required: false
        type: string
        description: ID of the Azure subscription to deploy to
      AZURE_CONTAINER_REGISTRY_FIREWALL:
        required: false
        type: boolean
        default: false
        description: True if the Azure Container Registry has a network firewall that needs to be bypassed before pushing images.

    secrets:
      BUILD_TIME_SECRETS:
        required: false
        description: A JSON object of secrets required at build-time (see above for example format)
      PIMCORE_ENTERPRISE_TOKEN:
        required: false
        description: (Optional) The value of your project's Pimcore Enterprise Token
      PIMCORE_PRODUCT_KEY:
        required: false
        description: (Optional) The Pimcore product key for the project
      PIMCORE_INSTANCE_IDENTIFIER:
        required: false
        description: (Optional) The Pimcore instance identifier for the project
      PIMCORE_ENCRYPTION_SECRET:
        required: false
        description: (Optional) The Pimcore encryption secret for the project
      TORQ_GITHUB_TOKEN:
        required: false
        description: (Optional) A GitHub access token used to access private GitHub repositories
      REPMAN_CLIENT_TOKEN:
        required: false
        description: (Optional) A client token for authenticating with a private Repman Composer repository
      RECAPTCHA_CLIENT_KEY:
        required: false
        description: (Optional) A client key used when building NPM frontends that require ReCAPTCHA
      GITHUB_APP_ID:
        required: false
        description: The ID of the GitHub App used to generate a token for checking out the project repository and submodules
      GITHUB_APP_PRIVATE_KEY:
        required: false
        description: The private key of the GitHub App used to generate a token for checking out the project repository and submodules
      CONTAINER_REGISTRY_USERNAME:
        required: false
        description: "Container registry username - only required if CONTAINER_REGISTRY is defined"
      CONTAINER_REGISTRY_PASSWORD:
        required: false
        description: "Container registry password - only required if CONTAINER_REGISTRY is defined"
      AZURE_SERVICE_PRINCIPAL_ID:
        required: false
        description: The ID of the Service Principal in Azure that will be used to deploy. The Service Principal must have permission to push images to the Container Registry and to deploy new revisions to the init, PHP and supervisord Container Apps.
      AZURE_SERVICE_PRINCIPAL_PASSWORD:
        required: false
        description: The password for the Service Principal in Azure

jobs:
  lint:
    name: Lint files
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Lint all files
        uses: ./reusable-workflow/.github/actions/lint

  vulnerability-scan:
    name: Scan for vulnerabilities in dependencies and code (SCA and SAST)
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    outputs:
      npm-outcome: ${{ steps.npm-scan.outcome }}
      composer-outcome: ${{ steps.composer-scan.outcome }}
      semgrep-outcome: ${{ steps.semgrep-scan.outcome }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Scan for npm vulnerabilities
        id: npm-scan
        continue-on-error: true
        run: |
          result=0
          > /tmp/npm-audit.txt
          while IFS= read -r -d '' f; do
            dir=$(dirname "$f")
            dir_slug=$(echo "$dir" | sed 's|^\./||;s|/|__|g')
            echo "--- Scanning $dir ---" | tee -a /tmp/npm-audit.txt
            npm audit --omit=dev --prefix "$dir" 2>&1 | tee -a /tmp/npm-audit.txt || true
            npm audit --json --omit=dev --prefix "$dir" 2>/dev/null \
              | jq --arg dir "$dir" '. + {_scannedDir: $dir}' \
              > "/tmp/npm-raw-${dir_slug:-root}.json" || true
            fixable_count=$(jq '[(.vulnerabilities // {}) | to_entries[] | select((.value.severity == "high" or .value.severity == "critical") and .value.fixAvailable == true)] | length' "/tmp/npm-raw-${dir_slug:-root}.json" 2>/dev/null || echo 0)
            if [ "$fixable_count" -gt 0 ]; then
              result=1
            else
              echo "No fixable high/critical vulnerabilities found" | tee -a /tmp/npm-audit.txt
            fi
          done < <(find . -name "package-lock.json" -not -path "*/node_modules/*" -print0)
          exit $result

      - name: Scan for composer vulnerabilities
        id: composer-scan
        continue-on-error: true
        run: |
          {
            PIMCORE_ENTERPRISE_TOKEN="${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}"
            if [[ -z "$PIMCORE_ENTERPRISE_TOKEN" ]]; then
              PIMCORE_ENTERPRISE_TOKEN=$(printf '%s' '${{ secrets.BUILD_TIME_SECRETS }}' | jq -r '."pimcore-enterprise-token" // empty' 2>/dev/null || true)
            fi
            if [[ -n "$PIMCORE_ENTERPRISE_TOKEN" ]]; then
              echo "::add-mask::$PIMCORE_ENTERPRISE_TOKEN"
              composer --working-dir=${{ inputs.PIMCORE_ROOT }} config --global --auth http-basic.repo.pimcore.com token "$PIMCORE_ENTERPRISE_TOKEN"
            fi
            REPMAN_CLIENT_TOKEN="${{ secrets.REPMAN_CLIENT_TOKEN }}"
            if [[ -z "$REPMAN_CLIENT_TOKEN" ]]; then
              REPMAN_CLIENT_TOKEN=$(printf '%s' '${{ secrets.BUILD_TIME_SECRETS }}' | jq -r '."repman-client-token" // empty' 2>/dev/null || true)
            fi
            if [[ -n "$REPMAN_CLIENT_TOKEN" ]]; then
              echo "::add-mask::$REPMAN_CLIENT_TOKEN"
              REPMAN_HOST=$(jq -r '.repositories // [] | map(select(.url // "" | contains("repman.io"))) | .[0].url // "" | ltrimstr("https://") | ltrimstr("http://") | rtrimstr("/")' ${{ inputs.PIMCORE_ROOT }}/composer.json 2>/dev/null || true)
              if [[ -n "$REPMAN_HOST" ]]; then
                composer --working-dir=${{ inputs.PIMCORE_ROOT }} config --global --auth http-basic.$REPMAN_HOST token "$REPMAN_CLIENT_TOKEN"
              fi
            fi
            if [ ! -f "${{ inputs.PIMCORE_ROOT }}/composer.lock" ]; then
              composer --working-dir=${{ inputs.PIMCORE_ROOT }} install --prefer-dist --no-scripts --ignore-platform-reqs
            fi
            composer --working-dir=${{ inputs.PIMCORE_ROOT }} audit --abandoned=ignore --locked --no-dev --format=json > /tmp/composer-audit.json 2>/dev/null || true
            composer --working-dir=${{ inputs.PIMCORE_ROOT }} audit --abandoned=ignore --locked --no-dev || true
          } 2>&1 | tee /tmp/composer-audit.txt || true
          high_critical_count=$(jq '[.advisories // {} | to_entries[] | .value[] | select(.ignored != true and (.severity == "high" or .severity == "critical"))] | length' /tmp/composer-audit.json 2>/dev/null || echo 0)
          [ "$high_critical_count" -eq 0 ]

      - name: Run Semgrep SAST scan
        id: semgrep-scan
        continue-on-error: true
        run: |
          pip install semgrep --quiet --break-system-packages
          semgrep scan \
            --config p/php \
            --config p/javascript \
            --config p/github-actions \
            --config p/typescript \
            --error \
            . 2>&1 | tee /tmp/semgrep.txt
          exit ${PIPESTATUS[0]}
        env:
          SEMGREP_SEND_METRICS: off

      - name: Upload scan results
        if: always()
        run: |
          mkdir -p scan-results
          cp /tmp/npm-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/npm-raw-*.json scan-results/ 2>/dev/null || true
          cp /tmp/composer-audit.txt scan-results/ 2>/dev/null || true
          cp /tmp/composer-audit.json scan-results/ 2>/dev/null || true
          cp /tmp/semgrep.txt scan-results/ 2>/dev/null || true

      - name: Upload scan results artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-results
          path: scan-results/
          if-no-files-found: ignore

      - name: Fail if any scan found issues
        if: >-
          steps.npm-scan.outcome == 'failure' ||
          steps.composer-scan.outcome == 'failure' ||
          steps.semgrep-scan.outcome == 'failure'
        run: |
          echo "One or more vulnerability scans found issues - see PR comment for details"
          exit 1

  run-unit-tests:
    name: Run unit tests
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    if: ${{ inputs.RUN_UNIT_TESTS }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker

      - name: Run unit tests
        uses: ./reusable-workflow/.github/actions/run-unit-tests
        with:
          DOCKERFILE: ${{ inputs.INIT && inputs.INIT_DOCKERFILE || inputs.PHP_DOCKERFILE }}
          DOCKERFILE_TARGET: ${{ inputs.INIT && inputs.INIT_DOCKER_TARGET || inputs.PHP_DOCKER_TARGET }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}
          PIMCORE_ENTERPRISE_TOKEN: ${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
          PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
          PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
          TORQ_GITHUB_TOKEN: ${{ secrets.TORQ_GITHUB_TOKEN }}
          UNIT_TESTS_DIRECTORY: ${{ inputs.UNIT_TESTS_DIRECTORY }}

  build:
    name: Build and scan ${{ matrix.name }} image
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    needs: [lint, vulnerability-scan, run-unit-tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ${{ inputs.INIT_IMAGE }}
            dockerfile: ${{ inputs.INIT_DOCKERFILE }}
            target: ${{ inputs.INIT_DOCKER_TARGET }}
          - name: ${{ inputs.PHP_IMAGE }}
            dockerfile: ${{ inputs.PHP_DOCKERFILE }}
            target: ${{ inputs.PHP_DOCKER_TARGET }}
            npm_build: ${{ inputs.NPM_BUILD }}
            npm_spa: ${{ inputs.NPM_SPA }}
            spa_twig: ${{ inputs.SPA_TWIG }}
            frontend_root: ${{ inputs.FRONTEND_ROOT }}
            npm_run_cmd: ${{ inputs.NPM_RUN_CMD }}
          - name: ${{ inputs.SUPERVISORD_IMAGE }}
            dockerfile: ${{ inputs.SUPERVISORD_DOCKERFILE }}
            target: ${{ inputs.SUPERVISORD_TARGET }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Check out project repository and submodules
        uses: ./reusable-workflow/.github/actions/checkout
        with:
          PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
          PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          SUBMODULES: ${{ inputs.SUBMODULES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
          GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Set up Docker
        uses: ./reusable-workflow/.github/actions/setup-docker
        with:
          DRIVER: docker
          CONTAINER_REGISTRY: ${{ inputs.CONTAINER_REGISTRY }}
          CONTAINER_REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Copy config files required for running with Azure Flysystem
        uses: ./reusable-workflow/.github/actions/azure-flysystem-copy-config
        if: ${{ inputs.AZURE_STORAGE && !inputs.FEATURE_FLAG_DISABLE_CONFIG_COPY }}
        with:
          PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}

      - name: Copy config files required for running with an Azure MySQL server
        uses: ./reusable-workflow/.github/actions/azure-mysql-copy-config
        if: ${{ inputs.AZURE_STORAGE && !inputs.FEATURE_FLAG_DISABLE_CONFIG_COPY }}
        with:
          PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Lint files
        uses: ./reusable-workflow/.github/actions/lint

      - name: Install required bundles if not already installed
        if: ${{ inputs.FEATURE_FLAG_INSTALL_MISSING_BUNDLES }}
        run: |
          set -euo pipefail

          bundles=(
            "torq/pimcore-flysystem-azure-bundle:^5.3"
          )

          for bundle in "${bundles[@]}"; do
            if composer show --no-interaction --no-ansi "$bundle" >/dev/null 2>&1; then
              echo "$bundle is already installed, skipping"
            else
              echo "$bundle not found, installing..."
              composer require --no-interaction --no-ansi --no-scripts "$bundle"
            fi
          done

      - name: Build ${{ matrix.name }} image
        if: matrix.name != 'init' || inputs.INIT
        uses: ./reusable-workflow/.github/actions/build-pimcore-image
        with:
          DOCKERFILE_TARGET: ${{ matrix.target }}
          DOCKERFILE_PATH: ${{ matrix.dockerfile }}
          BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
          BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
          PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}
          PIMCORE_ENTERPRISE_TOKEN: ${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}
          PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
          PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
          PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
          TORQ_GITHUB_TOKEN: ${{ secrets.TORQ_GITHUB_TOKEN }}
          FRONTEND_ROOT: ${{ matrix.frontend_root }}
          NPM_BUILD: ${{ matrix.npm_build }}
          RECAPTCHA_CLIENT_KEY: ${{ secrets.RECAPTCHA_CLIENT_KEY }}
          NPM_SPA: ${{ matrix.npm_spa }}
          SPA_TWIG: ${{ matrix.spa_twig }}
          NPM_RUN_CMD: ${{ matrix.npm_run_cmd }}
          PUSH: false
          TAGS: |
            "${{ inputs.CONTAINER_REGISTRY }}:${{ matrix.name }}:${{ inputs.IMAGES_TAG }}",
            "${{ inputs.CONTAINER_REGISTRY }}:${{ matrix.name }}:${{ github.run_id }}"

      - name: Free disk space before Trivy scan if needed
        if: matrix.name != 'init' || inputs.INIT
        run: |
          FREE_GB=$(df / --output=avail -BG | tail -1 | tr -d 'G')
          if [ "$FREE_GB" -lt 10 ]; then
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
            sudo swapoff -a && sudo rm -f /swapfile
          fi
        shell: bash

      - name: Run Trivy vulnerability scanner on image
        id: trivy-scan
        if: matrix.name != 'init' || inputs.INIT
        continue-on-error: true
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98 # v0.36.0
        with:
          image-ref: "${{ inputs.CONTAINER_REGISTRY }}:${{ matrix.name }}:${{ github.run_id }}"
          format: "table"
          output: "trivy-${{ matrix.name }}.txt"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          trivyignores: ${{ inputs.TRIVYIGNORE_PATH }}

      - name: Print Trivy results to log
        if: always()
        run: cat trivy-${{ matrix.name }}.txt 2>/dev/null || true

      - name: Upload Trivy results
        if: always()
        run: echo "${{ steps.trivy-scan.outcome }}" > trivy-${{ matrix.name }}-status.txt

      - name: Upload Trivy results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-results-${{ matrix.name }}
          path: |
            trivy-${{ matrix.name }}.txt
            trivy-${{ matrix.name }}-status.txt
          if-no-files-found: ignore

      - name: Fail if Trivy found vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "Trivy found CRITICAL or HIGH vulnerabilities in the ${{ matrix.name }} image"
          exit 1

      - name: Log in to Azure
        uses: ./reusable-workflow/.github/actions/azure-login
        if: ${{ inputs.AZURE_CONTAINER_REGISTRY_FIREWALL }}
        with:
          SERVICE_PRINCIPAL_ID: ${{ secrets.AZURE_SERVICE_PRINCIPAL_ID }}
          SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.AZURE_SERVICE_PRINCIPAL_PASSWORD }}
          TENANT: ${{ inputs.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ inputs.AZURE_SUBSCRIPTION_ID }}

      - name: Add exception to Azure Container Registry firewall, if one is in place
        if: ${{ inputs.AZURE_CONTAINER_REGISTRY_FIREWALL }}
        run: |
          az acr network-rule add -n ${{ inputs.CONTAINER_REGISTRY }} --ip-address $(curl ipinfo.io/ip)
          # Sleep for a few seconds to allow network rules to propagate
          sleep 60

      - name: Push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          push: ${{ inputs.CONTAINER_REGISTRY != '' }}
          tags: |
            "${{ inputs.CONTAINER_REGISTRY }}:${{ matrix.name }}:${{ inputs.IMAGES_TAG }}",
            "${{ inputs.CONTAINER_REGISTRY }}:${{ matrix.name }}:${{ github.run_id }}"

      - name: Remove exception from Azure Container Registry firewall, if one is in place
        if: always()
        run: |
          if [[ ${{ inputs.AZURE_CONTAINER_REGISTRY_FIREWALL }} == "true" ]]; then
            echo "Removing exception for this runner's IP from Container Registry firewall..."
            az acr network-rule remove -n ${{ inputs.CONTAINER_REGISTRY }} --ip-address $(curl ipinfo.io/ip)
          else
            echo "Container Registry has no firewall in place, so nothing to do"
          fi

  post-scan-report:
    name: Post security scan results to PR
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    needs: [vulnerability-scan, build]
    if: (success() || failure()) && github.event_name == 'pull_request' && inputs.POST_SCAN_RESULTS_TO_PR
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@b21f2a1dad0467fd79081fa16dad4f4935fc6253 # v1.0.3
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: ci-docker.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Post security scan results
        uses: ./reusable-workflow/.github/actions/post-scan-report
        with:
          NPM_OUTCOME: ${{ needs.vulnerability-scan.outputs.npm-outcome }}
          COMPOSER_OUTCOME: ${{ needs.vulnerability-scan.outputs.composer-outcome }}
          SEMGREP_OUTCOME: ${{ needs.vulnerability-scan.outputs.semgrep-outcome }}
          INIT: ${{ inputs.INIT }}
          REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
