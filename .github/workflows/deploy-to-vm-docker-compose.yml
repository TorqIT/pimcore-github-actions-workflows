# Builds, tags, and pushes Pimcore Docker images to a Container Registry, and runs them on a self-hosted runner via Docker Compose.
#
# Invoke this workflow in your project's workflow as follows:
# on:
#   push:
#     branches: [main, develop]
# jobs:
#   deploy-to-vm-docker-compose:
#     uses: TorqIT/pimcore-github-actions-workflows/.github/workflows/deploy-to-vm-docker-compose.yml@v7
#     permissions:
#       contents: read
#       actions: read
#       packages: write
#     with:
#       # required inputs
#     secrets:
#        CALLER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
#        BUILD_TIME_SECRETS: >
#          {
#            "pimcore-enterprise-token": "${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}",
#            ...any other build-time secrets you need
#          }
#        RUN_TIME_SECRETS: >
#          {
#            "database-password": "${{ secrets.DATABASE_PASSWORD }}",
#            "kernel-secret": "${{ secrets.KERNEL_SECRET }}",
#            ...any other run-time secrets you need
#          }
#       # other required secrets
#

name: VM Deployment via Docker Compose

on:
  workflow_call:
    inputs:
      ENVIRONMENT:
        required: true
        type: string
        description: "The GitHub Environment in which to run the workflow"
      RUNNER:
        required: true
        type: string
        description: Self-hosted runner for this workflow (see https://github.com/TorqIT/pimcore-github-actions-workflows#self-hosted-runners)
      PROJECT_REPOSITORY:
        required: false
        type: string
        default: ${{ github.repository }}
        description: "The repository in which the Pimcore project is located, in owner/repo format. If not provided, the value of github.repository will be used"
      PROJECT_REPOSITORY_REF:
        required: false
        type: string
        default: ${{ github.ref }}
        description: "The branch or tag of the repository to use. If not provided, the branch that this workflow was called from will be used"
      SKIP_LINTING:
        required: false
        type: boolean
        default: false
        description: "Whether linting should be skipped"
      NPM_BUILD:
        required: false
        type: boolean
        description: "Whether an NPM build should be run prior to building the PHP image"
      NPM_RUN_CMD:
        required: false
        default: "build"
        type: string
        description: "The NPM command that should be run prior to building the PHP image"
      NPM_SPA:
        required: false
        type: boolean
        description: "Whether the NPM build results in a single-page application"
      SPA_TWIG:
        required: false
        type: string
        default: "default/default.html.twig"
        description: "The path to the Twig file (relative to {{ inputs.PIMCORE_ROOT }}/templates/) where the result of the NPM single-page application build should be copied"
      FRONTEND_ROOT:
        required: false
        type: string
        default: "frontend"
        description: "The path (relative to the project's root) where frontend files are stored"
      SUBMODULES:
        required: false
        type: boolean
        default: false
        description: "Whether to clone submodules when cloning the project repository"
      PIMCORE_ROOT:
        required: false
        type: string
        default: "."
        description: "The path (relative to the project's root) in which the Pimcore files are stored (e.g. config, src, etc)"
      AZURE_MYSQL:
        required: false
        type: boolean
        default: false
        description: "Whether the application uses an Azure MySQL server instance as its database"
      AZURE_STORAGE:
        required: false
        type: boolean
        default: false
        description: "Whether the application uses Azure Storage and Flysystem for its file storage"
      CONTAINER_REGISTRY:
        required: true
        type: string
        description: "Docker Container Registry name"
      CONTAINER_REGISTRY_USERNAME:
        required: false
        type: string
        default: ${{ github.actor }}
        description: "Username to use to log in to the Docker Container Registry. By default we assume to be using a GitHub Container Registry, so the default value is {{ github.actor }}"
      BUILD_TIME_ARGS:
        required: false
        type: string
        default: "{}"
        description: "A JSON object containing Docker build-time args in key: value format"
      DOCKER_COMPOSE_FILE:
        required: true
        type: string
        description: "The name of the environment-specific Docker Compose file to use when deploying and running services"
      ENV_FILE:
        required: true
        type: string
        description: "Environment-specific .env file to be used when running Docker containers (assumed to be at the project root)"
      IMAGES_TAG:
        required: true
        type: string
        description: "Tag for built images (e.g. dev, test, prod); images will be tagged with this as well as the run ID"
      INIT:
        required: false
        type: boolean
        default: true
        description: "Whether to build and deploy an init service"
      INIT_IMAGE:
        required: false
        type: string
        default: "init"
        description: "Name of the init image"
      INIT_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the init image"
      INIT_DOCKER_TARGET:
        required: false
        type: string
        default: "init"
        description: 'The Docker target to use when building the init image. If your setup does not use targets, use an empty string ""'
      INIT_SERVICE:
        required: false
        type: string
        default: "init"
        description: "The name of the init service in Docker Compose to run"
      PHP_IMAGE:
        required: false
        type: string
        default: "php"
        description: "Name of the PHP Pimcore image"
      PHP_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the PHP image"
      PHP_DOCKER_TARGET:
        required: false
        type: string
        default: "php"
        description: 'The Docker target to use when building the PHP image. If your setup does not use targets, use an empty string ""'
      PHP_SERVICE:
        required: false
        type: string
        default: "php"
        description: "The name of the PHP service in Docker Compose to run"
      SUPERVISORD_IMAGE:
        required: false
        type: string
        default: "supervisord"
        description: "Name of the supervisord Pimcore image"
      SUPERVISORD_DOCKERFILE:
        required: false
        type: string
        default: ".docker/Dockerfile"
        description: "The path (relative to the project's root) of the Dockerfile used to build the supervisord image"
      SUPERVISORD_TARGET:
        required: false
        type: string
        default: "supervisord"
        description: 'The Docker target to use when building the supervisord image. If your setup does not use targets, use an empty string ""'
      SUPERVISORD_SERVICE:
        required: false
        type: string
        default: "supervisord"
        description: "The name of the supervisord service in Docker Compose to run"
      NON_PIMCORE_SERVICES:
        type: string
        required: false
        description: "Space separated list of non-Pimcore Docker Compose services to start on deployment (e.g. Redis, database, Elasticsearch)"
      RUN_TIME_SECRETS_AS_ENV_VARS:
        type: boolean
        required: false
        default: false
        description: "For legacy systems - set to true if you want the values in RUN_TIME_SECRETS to be stored as run-time env vars"
      USE_GHA_CACHE:
        required: false
        type: boolean
        default: true
        description: "Whether to use GitHub Actions cache for Docker layer caching during image builds"
      POST_DEPLOYMENT_COMMANDS:
        required: false
        type: string
        default: ""
        description: "Newline-delimited bash commands to run in the PHP container after deployment"
      FEATURE_FLAG_INSTALL_MISSING_BUNDLES:
        required: false
        type: boolean
        default: false
        description: "Feature flag - whether to automatically install missing required Pimcore bundles (e.g. Azure Flysystem bundle). Will be removed and assumed true in a future release."
      FEATURE_FLAG_DISABLE_CONFIG_COPY:
        required: false
        type: boolean
        default: false
        description: "Feature flag - whether to disable copying of config files for Azure MySQL and Azure Storage. Will be removed and assumed true in a future release."
      DOCKER_DIRECTORY:
        required: false
        type: string
        default: ".docker"
        description: "The path relative to the project's root of the directory where Docker-related files are stored"
      GITHUB_APP_CHECKOUT:
        required: false
        type: boolean
        default: false
        description: "Whether to use a GitHub App token for checking out the project repository and submodules"
      GITHUB_APP_CHECKOUT_REPOSITORIES:
        required: false
        type: string
        default: ""
        description: "A comma or newline-separated list of repositories to checkout with the GitHub App token - if empty, only the main project repository will be checked out"
      HEALTHCHECK_ENDPOINT:
        required: false
        type: string
        default: "/"
        description: "Sub-path (relative to http://localhost, using the format /my-healthcheck) to use when checking the health of the new deployment during blue/green deployment (e.g. /health or /status) - if empty, the root path will be used"
      TRIVYIGNORE_PATH:
        required: false
        type: string
        default: ""
        description: "Path to .trivyignore.yaml file (e.g. ./.trivyignore.yaml)"
      RUN_UNIT_TESTS:
        required: false
        type: boolean
        default: false
        description: "Whether to run unit tests. Default: false, but will be true in future versions"
      UNIT_TESTS_DIRECTORY:
        required: false
        type: string
        default: "tests"
        description: "The directory where unit tests are located - note this should be relative to the Pimcore root, as once inside the container the working directory is set to the Pimcore root"

    secrets:
      CALLER_GITHUB_TOKEN:
        required: true
        description: GitHub token from the caller repository
      CONTAINER_REGISTRY_PASSWORD:
        required: false
        description: Password for authenticating to the Docker Container Registry. If not supplied, the value of CALLER_GITHUB_TOKEN will be used (as we assume to be using a GitHub Container Registry in this case)
      BUILD_TIME_SECRETS:
        required: false
        description: A JSON object of secrets required at build-time (see above for example format)
      RUN_TIME_SECRETS:
        required: false
        description: A JSON object of secret environment variables required at run-time (see above for example format)
      PIMCORE_ENTERPRISE_TOKEN:
        required: false
        description: (Optional) The value of your project's Pimcore Enterprise Token
      PIMCORE_PRODUCT_KEY:
        required: false
        description: (Optional) The Pimcore product key for the project
      PIMCORE_INSTANCE_IDENTIFIER:
        required: false
        description: (Optional) The Pimcore instance identifier for the project
      PIMCORE_ENCRYPTION_SECRET:
        required: false
        description: (Optional) The Pimcore encryption secret for the project
      TORQ_GITHUB_TOKEN:
        required: false
        description: (Optional) A GitHub access token used to access private GitHub repositories
      REPMAN_CLIENT_TOKEN:
        required: false
        description: (Optional) A client token for authenticating with a private Repman Composer repository
      RECAPTCHA_CLIENT_KEY:
        required: false
        description: A client key used when building NPM frontends that require ReCAPTCHA
      SLACK_WORKFLOW_STATUS_WEBHOOK_URL:
        required: false
        description: Slack webhook URL to send workflow results to
      GITHUB_APP_ID:
        required: false
        description: The ID of the GitHub App used to generate a token for checking out the project repository and submodules
      GITHUB_APP_PRIVATE_KEY:
        required: false
        description: The private key of the GitHub App used to generate a token for checking out the project repository and submodules

jobs:
  ci:
    name: CI (Build, test, verify and push images)
    uses: ./.github/workflows/ci-docker.yml
    with:
      RUNNER: ${{ inputs.RUNNER }}
      PROJECT_REPOSITORY: ${{ inputs.PROJECT_REPOSITORY }}
      PROJECT_REPOSITORY_REF: ${{ inputs.PROJECT_REPOSITORY_REF }}
      GITHUB_APP_CHECKOUT: ${{ inputs.GITHUB_APP_CHECKOUT }}
      SUBMODULES: ${{ inputs.SUBMODULES }}
      CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
      NPM_BUILD: ${{ inputs.NPM_BUILD }}
      NPM_RUN_CMD: ${{ inputs.NPM_RUN_CMD }}
      NPM_SPA: ${{ inputs.NPM_SPA }}
      SPA_TWIG: ${{ inputs.SPA_TWIG }}
      FRONTEND_ROOT: ${{ inputs.FRONTEND_ROOT }}
      BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
      PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}
      IMAGES_TAG: "latest"
      INIT_IMAGE: ${{ vars.INIT_IMAGE }}
      INIT_DOCKERFILE: ${{ inputs.INIT_DOCKERFILE }}
      INIT_DOCKER_TARGET: ${{ inputs.INIT_DOCKER_TARGET }}
      PHP_IMAGE: ${{ vars.PHP_IMAGE }}
      PHP_DOCKERFILE: ${{ inputs.PHP_DOCKERFILE }}
      PHP_DOCKER_TARGET: ${{ inputs.PHP_DOCKER_TARGET }}
      SUPERVISORD_IMAGE: ${{ vars.SUPERVISORD_IMAGE }}
      SUPERVISORD_DOCKERFILE: ${{ inputs.SUPERVISORD_DOCKERFILE }}
      SUPERVISORD_TARGET: ${{ inputs.SUPERVISORD_TARGET }}
      RUN_UNIT_TESTS: ${{ inputs.RUN_UNIT_TESTS }}
      UNIT_TESTS_DIRECTORY: ${{ inputs.UNIT_TESTS_DIRECTORY }}
      TRIVYIGNORE_PATH: ${{ inputs.TRIVYIGNORE_PATH }}
      FEATURE_FLAG_INSTALL_MISSING_BUNDLES: ${{ inputs.FEATURE_FLAG_INSTALL_MISSING_BUNDLES }}
      FEATURE_FLAG_DISABLE_CONFIG_COPY: ${{ inputs.FEATURE_FLAG_DISABLE_CONFIG_COPY }}
      AZURE_MYSQL: ${{ inputs.AZURE_MYSQL }}
      AZURE_STORAGE: ${{ inputs.AZURE_STORAGE }}
      # AZURE_TENANT_ID: ${{ inputs.TENANT }}
      # AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # AZURE_CONTAINER_REGISTRY_FIREWALL: ${{ vars.CONTAINER_REGISTRY_FIREWALL }}
    secrets:
      BUILD_TIME_SECRETS: ${{ secrets.BUILD_TIME_SECRETS }}
      PIMCORE_ENTERPRISE_TOKEN: ${{ secrets.PIMCORE_ENTERPRISE_TOKEN }}
      PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
      PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
      PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
      TORQ_GITHUB_TOKEN: ${{ secrets.TORQ_GITHUB_TOKEN }}
      REPMAN_CLIENT_TOKEN: ${{ secrets.REPMAN_CLIENT_TOKEN }}
      RECAPTCHA_CLIENT_KEY: ${{ secrets.RECAPTCHA_CLIENT_KEY }}
      GITHUB_APP_ID: ${{ secrets.GITHUB_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
      CONTAINER_REGISTRY_USERNAME: ${{ inputs.CONTAINER_REGISTRY_USERNAME }}
      CONTAINER_REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD || secrets.CALLER_GITHUB_TOKEN }}
      # AZURE_SERVICE_PRINCIPAL_ID: ${{ secrets.AZURE_SERVICE_PRINCIPAL_ID }}
      # AZURE_SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.AZURE_SERVICE_PRINCIPAL_PASSWORD }}

  deploy-containers:
    name: Deploy containers via Docker Compose
    runs-on: ${{ inputs.RUNNER }}
    environment: ${{ inputs.ENVIRONMENT }}
    needs: [ci]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: |
            docker-compose.yaml
            ${{ inputs.DOCKER_COMPOSE_FILE }}
            ${{ inputs.ENV_FILE }}
            ${{ inputs.DOCKER_DIRECTORY }}
          sparse-checkout-cone-mode: false

      - name: Install jq
        uses: dcarbone/install-jq-action@b7ef57d46ece78760b4019dbc4080a1ba2a40b45 # v3.2.0
        with:
          version: "1.7"

      - name: Log in to Container Registry ${{ inputs.CONTAINER_REGISTRY }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ inputs.CONTAINER_REGISTRY }}
          username: ${{ inputs.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD || secrets.CALLER_GITHUB_TOKEN }}

      - name: Add run-time secrets to .env file
        if: ${{ inputs.RUN_TIME_SECRETS_AS_ENV_VARS }}
        run: |
          set -e
          echo "" >> ${{ inputs.ENV_FILE }}
          echo '${{ secrets.RUN_TIME_SECRETS }}' | jq -r 'to_entries | .[] | (.key | ascii_upcase | gsub("-"; "_")) + "=" + .value' >> ${{ inputs.ENV_FILE }}

      - name: Create Docker secret files
        run: |
          set -e
          mkdir -p .secrets
          echo '${{ secrets.RUN_TIME_SECRETS }}' | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
            echo -n "$value" > .secrets/"$key"
          done

      - name: Extract external volume names
        id: extract-volumes
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: >
            yq e -o=json '.volumes // {} | to_entries |
            map(select(.value.external == true or .value.external.name) |
            .value.external.name // .key)' ${{ inputs.DOCKER_COMPOSE_FILE }}

      - name: Extract external network names
        id: extract-networks
        uses: mikefarah/yq@1b9b4ac5187171d2e5e3129be0cfa827c7f9d53d # v4.53.3
        with:
          cmd: >
            yq e -o=json '.networks // {} | to_entries |
            map(select(.value.external == true or .value.external.name) |
            .value.external.name // .key)' ${{ inputs.DOCKER_COMPOSE_FILE }}

      - name: Create external volumes
        run: |
          set -e
          json='${{ steps.extract-volumes.outputs.result }}'
          echo "$json" | jq -r '.[]' | while read -r volume; do
              if ! docker volume inspect "$volume" >/dev/null 2>&1; then
                echo "Creating volume: $volume"
                docker volume create "$volume"
                echo "Adjust permissions on $volume"
                docker run --rm -v "$volume":/volume alpine chown -R 1000:1000 /volume
              else
                echo "Volume '$volume' already exists"
              fi
          done

      - name: Create external networks
        run: |
          set -e
          json='${{ steps.extract-networks.outputs.result }}'
          echo "$json" | jq -r '.[]' | while read -r network; do
              if ! docker network inspect "$network" >/dev/null 2>&1; then
                echo "Creating network: $network"
                docker network create "$network"
              else
                echo "Network '$network' already exists"
              fi
          done

      - name: Start generic services outside of blue/green (e.g. Redis, database, Elasticsearch, etc)
        run: |
          docker compose \
              -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
              --env-file ${{ inputs.ENV_FILE }} \
              up -d ${{ inputs.NON_PIMCORE_SERVICES }}

      - name: Pull latest built images
        run: |
          echo "Pulling latest built images..."
          if [[ "${{ inputs.INIT}}" == "true" ]]; then
            docker compose \
              -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
              --env-file ${{ inputs.ENV_FILE }} \
              pull \
              ${{ inputs.INIT_SERVICE }}
          fi
          docker compose \
            -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
            --env-file ${{ inputs.ENV_FILE }} \
            pull \
            ${{ inputs.PHP_SERVICE }} ${{ inputs.SUPERVISORD_SERVICE }}

      - name: Run init container
        if: ${{ inputs.INIT }}
        run: |
          echo "Running init container..."
          docker compose \
              -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
              --env-file ${{ inputs.ENV_FILE }} \
              run --rm ${{ inputs.INIT_SERVICE }}

      - name: Perform blue/green deployment of PHP and supervisord containers
        id: blue-green-deployment
        run: |
          if [ "$(docker ps -f name=blue -q)" ]; then
              NEW_DEPLOYMENT="green"
              OLD_DEPLOYMENT="blue"
          else
              NEW_DEPLOYMENT="blue"
              OLD_DEPLOYMENT="green"
          fi
          echo "new_deployment_name=$NEW_DEPLOYMENT" >> $GITHUB_OUTPUT

          echo "Starting "$NEW_DEPLOYMENT" containers..."
          docker compose \
              --project-name=$NEW_DEPLOYMENT \
              -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
              --env-file ${{ inputs.ENV_FILE }} \
              up -d ${{ inputs.PHP_SERVICE }} ${{ inputs.SUPERVISORD_SERVICE }}

          echo "Waiting for $NEW_DEPLOYMENT deployment to be ready..."
          set +e
          docker compose \
              --project-name=$NEW_DEPLOYMENT \
              -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
              --env-file ${{ inputs.ENV_FILE }} \
              exec -T ${{ inputs.PHP_SERVICE }} \
                  wget \
                    --verbose \
                    --content-on-error \
                    --retry-on-http-error=429,503,502,504 \
                    -T 3 -t 100 \
                    --retry-connrefused \
                    -O /dev/null \
                    "localhost${{ inputs.HEALTHCHECK_ENDPOINT }}"
          DEPLOY_STATUS=$?
          set -e

          if [[ $DEPLOY_STATUS == 0 ]]; then
              echo "Stopping "$OLD_DEPLOYMENT" containers..."
              docker compose \
                  --project-name=$OLD_DEPLOYMENT \
                  -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
                  --env-file ${{ inputs.ENV_FILE }} \
                  rm --stop --force ${{ inputs.PHP_SERVICE }} ${{ inputs.SUPERVISORD_SERVICE }}
          else
              set +e
              echo "Error bringing up new containers - here are stdout logs from failed container:"
              docker compose \
                  --project-name=$NEW_DEPLOYMENT \
                  -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
                  --env-file ${{ inputs.ENV_FILE }} \
                  logs \
                  ${{ inputs.PHP_SERVICE }}
              echo ""
              echo "Here is tail of var/log/APP_ENV-error.log:"
              docker compose \
                  --project-name=$OLD_DEPLOYMENT \
                  -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
                  --env-file ${{ inputs.ENV_FILE }} \
                  exec -it \
                    ${{ inputs.PHP_SERVICE }} \
                    bash -c '
                      if [ -f /var/www/html/var/log/$APP_ENV-error.log ]; then
                        tail -n 3 /var/www/html/var/log/$APP_ENV-error.log
                      else
                        echo "No error log file found at /var/www/html/var/log/$APP_ENV-error.log"
                      fi
                    '
              set -e
              echo "Stopping "$NEW_DEPLOYMENT" containers..."
              docker compose \
                  --project-name=$NEW_DEPLOYMENT \
                  -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
                  --env-file ${{ inputs.ENV_FILE }} \
                  rm --stop --force ${{ inputs.PHP_SERVICE }} ${{ inputs.SUPERVISORD_SERVICE }}
              exit 1
          fi

      - name: Run post-deployment commands
        if: ${{ inputs.POST_DEPLOYMENT_COMMANDS != '' }}
        run: |
          set -e

          docker compose \
            --project-name=${{ steps.blue-green-deployment.outputs.new_deployment_name }} \
            -f docker-compose.yaml -f ${{ inputs.DOCKER_COMPOSE_FILE }} \
            --env-file ${{ inputs.ENV_FILE }} \
            exec -T ${{ inputs.PHP_SERVICE }} \
            bash -s <<'EOF'
          ${{ inputs.POST_DEPLOYMENT_COMMANDS }}
          EOF

  workflow-failure-notification:
    name: Send workflow failure notification to Slack channel
    runs-on: "ubuntu-latest"
    environment: ${{ inputs.ENVIRONMENT }}
    if: failure()
    needs: [ci, deploy-containers]
    steps:
      - id: check-webhook-url
        # Hacky workaround to get around the fact that we cannot reference secrets in a conditional
        run: |
          if [ "${{ secrets.SLACK_WORKFLOW_STATUS_WEBHOOK_URL }}" != '' ]; then
            echo "Slack webhook URL is defined"
            echo "slackWebhookDefined=true" >> $GITHUB_OUTPUT;
          else
            echo "Slack webhook URL is not defined"
            echo "slackWebhookDefined=false" >> $GITHUB_OUTPUT;
          fi

      - name: Send job status to Slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        if: steps.check-webhook-url.outputs.slackWebhookDefined == 'true'
        with:
          webhook: ${{ secrets.SLACK_WORKFLOW_STATUS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub deployment failure*"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Deployment to ${{ inputs.ENVIRONMENT }} for ${{ github.repository }}* failed :x:\n\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
