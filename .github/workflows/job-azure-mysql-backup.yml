# Performs a backup of an Azure Database for MySQL flexible server database and saves it to a Storage Account.
#
# Invoke this workflow in your project's workflow as follows (example below triggers the workflow once per month):
# on:
#   schedule:
#     - cron: "0 0 1 * *"
# jobs:
#   db-backup:
#     uses: TorqIT/pimcore-github-actions-workflows/.github/workflows/job-azure-mysql-backup.yml@v7
#     permissions:
#       contents: read
#       actions: read
#     with:
#       ENVIRONMENT: production
#     secrets:
#       SERVICE_PRINCIPAL_ID: ${{ secrets.SERVICE_PRINCIPAL_ID }}
#       SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
#       SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
#
# The GitHub Environments you use with this workflow will need the following variables:
# - AZURE_TENANT_ID
#     description: ID of the Azure tenant to deploy to
#     required: true
# - AZURE_SUBSCRIPTION_ID
#     description: ID of the Azure subscription to deploy to
#     required: true
# - RESOURCE_GROUP
#     description: Name of the Resource Group that hosts the server
#     required: true
# - AZURE_MYSQL_SERVER
#     description: Name of the MySQL server
#     required: true
# - AZURE_DB_BACKUPS_STORAGE_ACCOUNT
#     description: Name of the Storage Account in which to store backups
#     required: true
# - AZURE_MYSQL_USERNAME
#     description: Username with which to log in to the server
#     required: false
#     default value: adminuser
#

name: Azure DB Backup

on:
  workflow_call:
    inputs:
      RUNNER:
        required: false
        type: string
        description: Optional self-hosted runner for this workflow (see https://github.com/TorqIT/pimcore-github-actions-workflows#self-hosted-runners)
      ENVIRONMENT:
        required: true
        type: string
      IGNORE_TABLES:
        required: false
        type: string
        default: "messenger_messages,sessions"
        description: Comma-separated list of table names to ignore during dump (e.g., "messenger_messages,sessions")
      IGNORE_TABLE_PATTERNS:
        required: false
        type: string
        default: "application_logs_archive_.*,messenger_messages_.*"
        description: Regex pattern for table names to ignore during dump (e.g., "cache_.*,temp_.*")
      MYDUMPER_THREADS:
        required: false
        type: number
        default: 4
        description: Number of threads to use for the mydumper operation

    secrets:
      SERVICE_PRINCIPAL_ID:
        required: true
        description: The ID of the Service Principal in Azure that will be used to deploy. The Service Principal must have permission to update settings on the MySQL server and on the Storage Account. It must also be able to create blobs in the Storage Account.
      SERVICE_PRINCIPAL_PASSWORD:
        required: true
        description: The password for the Service Principal in Azure
      AZURE_MYSQL_PASSWORD:
        required: true
        description: The password used to log in to the MySQL server and perform the backup
      SLACK_BACKUPS_WEBHOOK_URL:
        required: true
        description: Webhook URL to send job status messages to

jobs:
  back-up-db:
    name: Back up Azure MySQL database to a Storage Account
    runs-on: ${{ inputs.RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.ENVIRONMENT }}
    steps:
      - name: Get workflow version
        id: workflow-version
        uses: canonical/get-workflow-version-action@ba22d0abdc1eda539aa3ac81af1cfee160b10714 # v1.0.4
        with:
          repository-name: TorqIT/pimcore-github-actions-workflows
          file-name: job-azure-mysql-backup.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout workflow repository to use composite actions
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: TorqIT/pimcore-github-actions-workflows
          ref: ${{ steps.workflow-version.outputs.sha }}
          path: reusable-workflow
          fetch-depth: 1

      - name: Install tools for workflows/actions
        uses: ./reusable-workflow/.github/actions/setup-tools

      - name: Install mydumper
        run: |
          set -e
          echo "Installing mydumper..."
          MYDUMPER_VERSION="0.20.1-2"
          wget https://github.com/mydumper/mydumper/releases/download/v${MYDUMPER_VERSION}/mydumper_${MYDUMPER_VERSION}.$(lsb_release -cs)_amd64.deb
          sudo dpkg -i mydumper_${MYDUMPER_VERSION}.$(lsb_release -cs)_amd64.deb || sudo apt-get install -f -y
          mydumper --version

      - name: Log in to Azure
        uses: ./reusable-workflow/.github/actions/azure-login
        with:
          SERVICE_PRINCIPAL_ID: ${{ secrets.SERVICE_PRINCIPAL_ID }}
          SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.SERVICE_PRINCIPAL_PASSWORD }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Add temporary network rule for this runner to database server and Storage Account firewalls
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            set -e
            runnerIp=$(curl ipinfo.io/ip)
            echo "Adding temporary network rule for this runner ($runnerIp) to database server's firewall..."            
            az mysql flexible-server firewall-rule create \
              --name ${{ vars.AZURE_MYSQL_SERVER }} \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --rule-name allow-runner-ip \
              --start-ip-address $runnerIp \
              --end-ip-address $runnerIp \
              --verbose
            echo "Adding temporary network rule for this runner ($runnerIp) to Storage Account's firewall..."
            az storage account network-rule add \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --account-name ${{ vars.AZURE_DB_BACKUPS_STORAGE_ACCOUNT }} \
              --ip-address $runnerIp \
              --verbose
            echo "Sleep for 120 seconds to allow network rule to propagate to Storage Account..."
            sleep 120

      - name: Perform a MySQL dump and save the result to Storage Account
        id: dump
        run: |
          set -euo pipefail

          timestamp="$(date -u +"%Y-%m-%dT%H-%M-%SZ")"
          dumpDir="db_dump_${timestamp}"
          fileName="${timestamp}.tar.gz"
          dbHost="${{ vars.AZURE_MYSQL_SERVER }}.mysql.database.azure.com"
          dbUser="${{ vars.AZURE_MYSQL_USERNAME || 'adminuser' }}"
          dbName="${{ vars.AZURE_MYSQL_DATABASE || 'pimcore' }}"

          OMIT_FILE="omit_tables.txt"
          touch "$OMIT_FILE"

          # Add specific tables to exclude data
          if [ -n "${{ inputs.IGNORE_TABLES }}" ]; then
            IFS=',' read -ra TABLES <<< "${{ inputs.IGNORE_TABLES }}"
            for table in "${TABLES[@]}"; do
              table=$(echo "$table" | xargs)
              if [ -n "$table" ]; then
                echo "$dbName.$table" >> "$OMIT_FILE"
                echo "Will exclude data for table: $table"
              fi
            done
          fi

          # Query database for tables matching patterns and add them to omit file
          if [ -n "${{ inputs.IGNORE_TABLE_PATTERNS }}" ]; then
            IFS=',' read -ra PATTERNS <<< "${{ inputs.IGNORE_TABLE_PATTERNS }}"
            for pattern in "${PATTERNS[@]}"; do
              pattern=$(echo "$pattern" | xargs)
              if [ -n "$pattern" ]; then
                echo "Finding tables matching pattern: $pattern"
                
                MYSQL_PWD="${{ secrets.AZURE_MYSQL_PASSWORD }}" \
                  mysql \
                  -h "${{ vars.AZURE_MYSQL_SERVER }}.mysql.database.azure.com" \
                  -P "3306" \
                  -u "${{ vars.AZURE_MYSQL_USERNAME || 'adminuser' }}" \
                  --ssl-mode=PREFERRED \
                  -N -s \
                  -e "SELECT CONCAT('${{ vars.AZURE_MYSQL_DATABASE || 'pimcore' }}.', table_name) \
                      FROM information_schema.tables \
                      WHERE table_schema = '${{ vars.AZURE_MYSQL_DATABASE || 'pimcore' }}' \
                      AND table_name REGEXP '$pattern';" \
                  >> "$OMIT_FILE"
              fi
            done
          fi

          OMIT_OPTION=""
          if [ -s "$OMIT_FILE" ]; then
            echo "Tables to exclude data:"
            cat "$OMIT_FILE"
            OMIT_OPTION="--omit-from-file=$OMIT_FILE"
          fi

          echo "Performing database dump with mydumper..."
          MYSQL_PWD="${{ secrets.AZURE_MYSQL_PASSWORD }}" \
            mydumper \
              --host="$dbHost" \
              --user="$dbUser" \
              --database="$dbName" \
              --ssl-mode=PREFERRED \
              --outputdir="$dumpDir" \
              --threads=${{ inputs.MYDUMPER_THREADS }} \
              --compress \
              --routines \
              --triggers \
              --trx-tables \
              --sync-thread-lock-mode=NO_LOCK \
              $OMIT_OPTION \
              --verbose=3

          echo "Compressing dump directory..."
          tar -czf "$fileName" "$dumpDir"
          rm -rf "$dumpDir"

          fileSize="$(wc -c < "$fileName")"
          echo "Dumped file is $fileSize bytes (compressed)"

          echo "Uploading backup to Storage Account..."
          az storage blob upload \
            --account-name "${{ vars.AZURE_DB_BACKUPS_STORAGE_ACCOUNT }}" \
            --container-name "${{ vars.AZURE_DB_BACKUPS_STORAGE_ACCOUNT_CONTAINER || 'database' }}" \
            --name "$fileName" \
            --file "$fileName" \
            --auth-mode login \
            >/dev/null
          rm -f "$fileName"
          echo "Uploaded $fileName successfully"

          echo "fileName=$fileName" >> $GITHUB_OUTPUT
          echo "fileSize=$fileSize" >> $GITHUB_OUTPUT
          if [ "$fileSize" -le 0 ]; then
            exit 1;
          fi

      - name: Remove temporary network rule from database server firewall
        if: always()
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            set -e
            az mysql flexible-server firewall-rule delete \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --name ${{ vars.AZURE_MYSQL_SERVER }} \
              --rule-name allow-runner-ip \
              --yes

      - name: Remove temporary network rule from Storage Account firewall
        if: always()
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
        with:
          inlineScript: |
            set -e
            runnerIp=$(curl ipinfo.io/ip)
            az storage account network-rule remove \
              --resource-group ${{ vars.RESOURCE_GROUP }} \
              --account-name ${{ vars.AZURE_DB_BACKUPS_STORAGE_ACCOUNT }} \
              --ip-address $runnerIp

      - name: Send job status to Slack
        if: ${{ !cancelled() }}
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook: ${{ secrets.SLACK_BACKUPS_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*Azure MySQL Database backup job*"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "*Database backup job for ${{ github.repository }}*: ${{ job.status == 'success' && 'Success! :white_check_mark:' || 'Failed :x:' }}\n\nDumped file *${{ steps.dump.outputs.fileName }}* was *${{ steps.dump.outputs.fileSize }}* bytes\n\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
