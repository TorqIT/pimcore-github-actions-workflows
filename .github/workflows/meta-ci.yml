# META - not reusable, runs directly on this repository

name: "CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: "meta-ci-docker-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  meta:
    name: "Meta CI checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Lint files
        uses: ./.github/actions/lint

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color -shellcheck=

  skeleton-ci:
    name: "Test CI workflow against Pimcore skeleton"
    uses: ./.github/workflows/ci-docker.yml
    strategy:
      matrix:
        branch: [2024.x, 2025.x, skeleton/prepare-2026.x]
    with:
      PROJECT_REPOSITORY: TorqIT/pimcore-skeleton
      PROJECT_REPOSITORY_REF: ${{ matrix.branch }}
      GITHUB_APP_CHECKOUT: true
      RUN_UNIT_TESTS: ${{ matrix.branch != '2024.x' }}
    secrets:
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
      PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
      PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}

  skeleton-ci-azure:
    name: "Test Azure CD workflow against Pimcore skeleton"
    strategy:
      matrix:
        include:
          - branch: 2025.x
            parameters_file: "./.github/ci/azure/parameters.2025-x.json"
            skeleton_ref: skeleton/recipes # TODO changeme back to 2025.x
          - branch: 2026.x
            parameters_file: "./.github/ci/azure/parameters.2026-x.json"
            skeleton_ref: skeleton/recipes-2026.x # TODO changeme back to 2026.x
    uses: ./.github/workflows/meta-ci-azure.yml
    with:
      ENVIRONMENT: ${{ matrix.branch }}
      PARAMETERS_FILE: ${{ matrix.parameters_file }}
      PROJECT_REPOSITORY_REF: ${{ matrix.skeleton_ref }}
    secrets:
      PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_ENCRYPTION_SECRET }}
      PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_INSTANCE_IDENTIFIER }}
      PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_PRODUCT_KEY }}
      CI_SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.CI_SERVICE_PRINCIPAL_PASSWORD }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
  # TODO test CD to VM
