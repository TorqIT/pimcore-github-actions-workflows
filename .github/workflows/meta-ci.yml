# META - not reusable, runs directly on this repository

name: "CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: "meta-ci-docker-pr-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  meta:
    name: "Meta CI checks on workflows repo"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint files
        uses: ./.github/actions/lint

  skeleton-ci:
    name: "Test CI against skeleton"
    uses: ./.github/workflows/ci-docker.yml
    strategy:
      fail-fast: false
      matrix:
        branch: [main]
    with:
      PROJECT_REPOSITORY: TorqIT/shopware-skeleton
      PROJECT_REPOSITORY_REF: main
      SHOPWARE_ROOT: src
      E2E_TESTS_DIRECTORY: e2e
      E2E_TESTS_HOSTNAME: "demo.localhost.torq"
      GITHUB_APP_CHECKOUT: true
      RUN_UNIT_TESTS: true
      RUN_PHPSTAN: true
      POST_SCAN_RESULTS_TO_PR: true
    secrets:
      GITHUB_APP_ID: ${{ secrets.GH_APP_ID }}
      GITHUB_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}

  skeleton-ci-azure:
    name: "Test Azure CD against skeleton"
    strategy:
      fail-fast: false
      matrix:
        include:
          - github_environment: 6.6
            parameters_file: "./.github/ci/azure/parameters.6.6.json"
            skeleton_ref: main
    uses: ./.github/workflows/meta-ci-azure.yml
    with:
      ENVIRONMENT: ${{ matrix.github_environment }}
      PARAMETERS_FILE: ${{ matrix.parameters_file }}
      PROJECT_REPOSITORY_REF: ${{ matrix.skeleton_ref }}
    secrets:
      SHOPWARE_COMPOSER_TOKEN: ${{ secrets.SHOPWARE_COMPOSER_TOKEN }}
      CI_SERVICE_PRINCIPAL_PASSWORD: ${{ secrets.CI_SERVICE_PRINCIPAL_PASSWORD }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
