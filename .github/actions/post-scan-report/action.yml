name: "Post Security Scan Results"
description: "Posts security scan results as a PR comment, creating or updating an existing comment"

inputs:
  NPM_OUTCOME:
    required: true
    description: "Outcome of the npm vulnerability scan (success/failure/skipped)"
  COMPOSER_OUTCOME:
    required: true
    description: "Outcome of the Composer vulnerability scan (success/failure/skipped)"
  SEMGREP_OUTCOME:
    required: true
    description: "Outcome of the Semgrep SAST scan (success/failure/skipped)"
  INIT:
    required: false
    default: "true"
    description: "Whether the project uses an init container (omits the init Trivy row when false)"
  REF:
    required: true
    description: "The branch/ref name used in the comment marker for deduplication"
  GITHUB_TOKEN:
    required: true
    description: "GitHub token for posting PR comments (requires pull-requests: write)"

runs:
  using: "composite"
  steps:
    - name: Compute ref slug
      id: ref-slug
      shell: bash
      env:
        REF: ${{ inputs.REF }}
      run: echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

    - name: Download scan results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: scan-results-${{ steps.ref-slug.outputs.slug }}
        path: ./scan-results
      continue-on-error: true

    - name: Download Trivy results (init)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-init-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-init
      continue-on-error: true

    - name: Download Trivy results (php)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-php-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-php
      continue-on-error: true

    - name: Download Trivy results (supervisord)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-supervisord-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-supervisord
      continue-on-error: true

    - name: Post security scan results to PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        # Inputs go through env rather than inline ${{ }} so the script is not
        # evaluated as one expression (GitHub caps those at 21000 chars) and so
        # the branch name in REF cannot inject shell code.
        NPM_OUTCOME: ${{ inputs.NPM_OUTCOME }}
        COMPOSER_OUTCOME: ${{ inputs.COMPOSER_OUTCOME }}
        SEMGREP_OUTCOME: ${{ inputs.SEMGREP_OUTCOME }}
        INIT: ${{ inputs.INIT }}
        REF: ${{ inputs.REF }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        npm_outcome="$NPM_OUTCOME"
        composer_outcome="$COMPOSER_OUTCOME"
        semgrep_outcome="$SEMGREP_OUTCOME"
        php_outcome=$(cat ./trivy-results-php/trivy-php-status.txt 2>/dev/null || echo "unknown")
        supervisord_outcome=$(cat ./trivy-results-supervisord/trivy-supervisord-status.txt 2>/dev/null || echo "unknown")

        status_icon() {
          case "$1" in
            success) echo "✅ Passed" ;;
            failure) echo "❌ Failed" ;;
            skipped) echo "❌ Skipped" ;;
            *) echo "⚠️ Unknown" ;;
          esac
        }

        if [[ "$INIT" == "true" ]]; then
          init_outcome=$(cat ./trivy-results-init/trivy-init-status.txt 2>/dev/null || echo "unknown")
          labels=("npm audit" "Composer audit" "Semgrep SAST" "Trivy (init image)" "Trivy (php image)" "Trivy (supervisord image)")
          outcomes=("$npm_outcome" "$composer_outcome" "$semgrep_outcome" "$init_outcome" "$php_outcome" "$supervisord_outcome")
        else
          labels=("npm audit" "Composer audit" "Semgrep SAST" "Trivy (php image)" "Trivy (supervisord image)")
          outcomes=("$npm_outcome" "$composer_outcome" "$semgrep_outcome" "$php_outcome" "$supervisord_outcome")
        fi

        failure_count=0
        for i in "${!outcomes[@]}"; do
          if [ "${outcomes[$i]}" = "failure" ] || [ "${outcomes[$i]}" = "skipped" ]; then
            failure_count=$((failure_count + 1))
          fi
        done

        LOGS_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        {
          echo "<!-- vulnerability-scan-results-$REF -->"
          echo "## Security Scan Results for $REF"
          echo ""

          if [ "$failure_count" -gt 0 ]; then
            echo "> [!CAUTION]"
            echo "> **$failure_count scan(s) failed** — action required. See below for what to fix."
          else
            echo "> [!TIP]"
            echo "> All scans passed — no immediate action required."
          fi
          echo ""

          echo "| Scan | Status |"
          echo "|------|--------|"
          for i in "${!labels[@]}"; do
            echo "| ${labels[$i]} | $(status_icon "${outcomes[$i]}") |"
          done

          # Abandoned Composer packages don't fail the build (composer-scan runs
          # `--abandoned=report`), so surface them here unconditionally rather
          # than nesting under the failure_count block below.
          if [ -f "./scan-results/composer-audit.json" ]; then
            abandoned_rows=$(jq -r '.abandoned // {} | to_entries[] | [.key, (.value // "-")] | @tsv' ./scan-results/composer-audit.json 2>/dev/null || echo "")
            if [ -n "$abandoned_rows" ]; then
              abandoned_count=$(echo "$abandoned_rows" | wc -l)
              echo ""
              echo "> [!WARNING]"
              echo "> **$abandoned_count Composer package(s) are abandoned**. These should be migrated when convenient."
              echo ""
              echo "| Package | Suggested Replacement |"
              echo "|---------|------------------------|"
              while IFS=$'\t' read -r pkg replacement; do
                if [ "$replacement" = "-" ] || [ -z "$replacement" ]; then
                  echo "| \`$pkg\` | _none suggested_ |"
                else
                  echo "| \`$pkg\` | \`$replacement\` |"
                fi
              done <<< "$abandoned_rows"
            fi
          fi

          if [ "$failure_count" -gt 0 ]; then
            echo ""
            echo "---"
            echo ""
            echo "_Refer to the [action logs]($LOGS_URL) for full scan output._"

            if [ "$npm_outcome" = "failure" ]; then
              echo ""
              echo "<details>"
              echo "<summary><strong>npm audit</strong></summary>"
              echo ""
              # Findings and Markdown come from .github/scripts/npm-audit-findings.mjs,
              # run during the scan, so the report shows exactly what failed it.
              found_any=false
              for report_file in ./scan-results/npm-report-*.md; do
                [ -s "$report_file" ] || continue
                found_any=true
                cat "$report_file"
              done
              if [ "$found_any" = false ]; then
                echo "Could not parse detailed results — refer to the [action logs]($LOGS_URL)."
                echo ""
              fi
              echo "</details>"
              echo ""
            fi

            if [ "$composer_outcome" = "failure" ]; then
              echo ""
              echo "<details>"
              echo "<summary><strong>Composer audit</strong></summary>"
              echo ""
              install_exit_code=$(cat ./scan-results/composer-install-exit.txt 2>/dev/null || echo "0")
              if [ "$install_exit_code" != "0" ]; then
                echo "**\`composer install\` failed — see the install output below or the [action logs]($LOGS_URL) for details.**"
                echo ""
                echo "<details>"
                echo "<summary>Install output</summary>"
                echo ""
                echo '```'
                tail -c 4000 ./scan-results/composer-audit.txt 2>/dev/null || echo "(no output captured)"
                echo '```'
                echo ""
                echo "</details>"
                echo ""
              elif [ -f "./scan-results/composer-audit.json" ] && jq empty ./scan-results/composer-audit.json 2>/dev/null; then
                # Read from the file rather than --argjson (see the npm section).
                pkgs_file="./scan-results/composer-packages.json"
                jq empty "$pkgs_file" 2>/dev/null || pkgs_file=/dev/null
                rows=$(jq -r --slurpfile pkgs_in "$pkgs_file" '
                  def norm(v):
                    (v // "" | ascii_downcase | ltrimstr("v")) as $s |
                    ($s | [scan("[0-9]+")] | map(tonumber)) as $parts |
                    ($parts + [0,0,0,0,0,0])[0:6];
                  def vcmp(a; b):
                    (norm(a)) as $a | (norm(b)) as $b |
                    ([range(0;6)] | map($a[.] - $b[.]) | map(select(. != 0)) | first) // 0;
                  def satisfies(cur; constraint):
                    if (constraint == "") then true
                    elif (constraint | startswith(">=")) then vcmp(cur; constraint[2:]) >= 0
                    elif (constraint | startswith("<=")) then vcmp(cur; constraint[2:]) <= 0
                    elif (constraint | startswith("!=")) then vcmp(cur; constraint[2:]) != 0
                    elif (constraint | startswith("==")) then vcmp(cur; constraint[2:]) == 0
                    elif (constraint | startswith(">")) then vcmp(cur; constraint[1:]) > 0
                    elif (constraint | startswith("<")) then vcmp(cur; constraint[1:]) < 0
                    else true
                    end;
                  # affectedVersions is "|"-separated windows of ","-joined constraints
                  # (a package can have separate vulnerable windows). The fix is the
                  # exclusive upper bound of the window the installed version is in. An
                  # inclusive "<=X" bound means no fixed release is known, so null.
                  def fix_for(cur; affected):
                    (affected // "" | split("|") | map(split(",") | map(gsub("^ +| +$"; "")) | map(select(. != "")))) as $ranges |
                    ($ranges | map(select(. as $r | $r | map(satisfies(cur; .)) | all)) | first) as $window |
                    if $window == null then null
                    else ($window | map(select(startswith("<") and (startswith("<=") | not))) | first | if . then .[1:] else null end)
                    end;
                  (($pkgs_in[0] // []) | map({(.name): .version}) | add // {}) as $versions |
                  .advisories // {} | to_entries[] |
                  .key as $pkg |
                  ($versions[$pkg] // "unknown") as $current_ver |
                  [.value[] | select(.ignored != true)] as $advs |
                  select($advs | any(.severity == "high" or .severity == "critical")) |
                  # One row per package: the fix must clear every advisory, so it is the
                  # highest per-advisory fix, and unknown if any advisory has none.
                  ($advs | map(fix_for($current_ver; .affectedVersions))) as $fixes |
                  (if ($fixes | any(. == null)) then "-" else ($fixes | sort_by(norm(.)) | last) end) as $fix |
                  ($advs | sort_by(if .severity == "critical" then 0 elif .severity == "high" then 1 else 2 end)) as $sorted |
                  [$pkg,
                   (if ($advs | any(.severity == "critical")) then "CRITICAL" else "HIGH" end),
                   $current_ver, $fix,
                   ($sorted | map(
                      (if .link then "[\(.advisoryId // .cve // "advisory")](\(.link))" else (.advisoryId // "-") end) +
                      (if .cve then " / [\(.cve)](https://nvd.nist.gov/vuln/detail/\(.cve))" else "" end)
                    ) | .[0:3] | join(", ")) + (if ($advs | length) > 3 then " _+\(($advs | length) - 3) more_" else "" end)
                  ] |
                  @tsv
                ' ./scan-results/composer-audit.json 2>/dev/null || echo "")
                if [ -n "$rows" ]; then
                  echo "| Package | Severity | Installed | Fixed in | Advisories | Command |"
                  echo "|---------|----------|-----------|----------|------------|---------|"
                  while IFS=$'\t' read -r pkg severity current_ver fix_ver advisory_col; do
                    [ "$fix_ver" = "-" ] && fix_col="-" || fix_col="\`$fix_ver\`"
                    echo "| \`$pkg\` | $severity | \`$current_ver\` | $fix_col | $advisory_col | \`composer update $pkg\` |"
                  done <<< "$rows"
                  echo ""
                else
                  echo "No HIGH or CRITICAL advisories found — refer to the [action logs]($LOGS_URL) for lower-severity findings."
                  echo ""
                fi
              else
                echo "\`composer audit\` did not produce results (e.g. a registry or authentication error) — refer to the [action logs]($LOGS_URL)."
                echo ""
              fi
              echo "</details>"
              echo ""
            fi

            if [ "$semgrep_outcome" = "failure" ]; then
              echo ""
              echo "<details>"
              echo "<summary><strong>Semgrep SAST</strong></summary>"
              echo ""
              if [ -f "./scan-results/semgrep.json" ]; then
                # `semgrep --error` fails on a finding of any severity, so list them all
                # (most severe first). Cells are escaped: a "|" would end the cell.
                rows=$(jq -r '
                  def esc: gsub("\\|"; "\\|");
                  .results // [] |
                  sort_by((.extra.severity | {"ERROR": 0, "WARNING": 1}[.] // 2), .path, .start.line) |
                  .[] |
                  [
                    ("[" + (.check_id | split(".") | last) + "](https://semgrep.dev/r/" + .check_id + ")"),
                    (.path | esc),
                    (.start.line | tostring),
                    .extra.severity,
                    (.extra.message | gsub("[\n\r\t]"; " ") | .[0:300] | esc)
                  ] |
                  # Not @tsv: it would double the backslash in the "\|" escapes.
                  join("\t")
                ' ./scan-results/semgrep.json 2>/dev/null || echo "")
                semgrep_errors=$(jq -r '.errors // [] | map(.message // .type // "error" | tostring | gsub("[\n\r\t]"; " ") | .[0:200]) | .[0:5] | .[] | "- " + .' ./scan-results/semgrep.json 2>/dev/null || echo "")
                if [ -n "$rows" ]; then
                  echo "| Rule | Location | Severity | Message |"
                  echo "|------|----------|----------|---------|"
                  while IFS=$'\t' read -r rule file line severity message; do
                    echo "| $rule | \`$file:$line\` | $severity | $message |"
                  done <<< "$rows"
                  echo ""
                elif [ -n "$semgrep_errors" ]; then
                  echo "Semgrep reported errors rather than findings:"
                  echo ""
                  echo "$semgrep_errors"
                  echo ""
                else
                  echo "Could not parse detailed results — refer to the [action logs]($LOGS_URL) for the flagged patterns and file locations."
                  echo ""
                fi
              else
                echo "Could not parse detailed results — refer to the [action logs]($LOGS_URL) for the flagged patterns and file locations."
                echo ""
              fi
              echo "</details>"
              echo ""
            fi

            if [[ "$INIT" == "true" ]]; then
              trivy_names=("init" "php" "supervisord")
              trivy_labels=("Trivy (init image)" "Trivy (php image)" "Trivy (supervisord image)")
              trivy_outcomes=("$init_outcome" "$php_outcome" "$supervisord_outcome")
            else
              trivy_names=("php" "supervisord")
              trivy_labels=("Trivy (php image)" "Trivy (supervisord image)")
              trivy_outcomes=("$php_outcome" "$supervisord_outcome")
            fi
            for j in "${!trivy_names[@]}"; do
              name="${trivy_names[$j]}"
              label="${trivy_labels[$j]}"
              t_outcome="${trivy_outcomes[$j]}"
              if [ "$t_outcome" = "failure" ] || [ "$t_outcome" = "skipped" ]; then
                echo ""
                echo "<details>"
                echo "<summary><strong>$label</strong></summary>"
                echo ""
                if [ "$t_outcome" = "skipped" ]; then
                  echo "The Trivy scan was skipped, likely because the Docker image build failed. Refer to the [action logs]($LOGS_URL) for details."
                  echo ""
                else
                  echo "These may contain OS-level package vulnerabilities that require updates (e.g. \`apt update <package>\`) to be added to the Dockerfile."
                  echo ""
                  trivy_text=$(cat "./trivy-results-${name}/trivy-${name}.txt" 2>/dev/null || echo "")
                  if [ -n "$trivy_text" ]; then
                    trivy_lines=$(echo "$trivy_text" | wc -l)
                    echo '```'
                    echo "$trivy_text" | head -150 || true
                    if [ "$trivy_lines" -gt 150 ]; then
                      echo "... $((trivy_lines - 150)) more lines — refer to the [action logs]($LOGS_URL) for the full output."
                    fi
                    echo '```'
                    echo ""
                  fi
                fi
                echo "</details>"
                echo ""
              fi
            done
          fi

        } > /tmp/pr-comment.md

        # GitHub's comment body limit is 65536 chars — hard-truncate if still over
        if [ "$(wc -c < /tmp/pr-comment.md)" -gt 65000 ]; then
          { head -c 64800 /tmp/pr-comment.md; printf '\n\n---\n_Output truncated — [refer to action logs](%s) for full results._\n' "$LOGS_URL"; } > /tmp/pr-comment-truncated.md
          mv /tmp/pr-comment-truncated.md /tmp/pr-comment.md
        fi

        REPO="$GITHUB_REPOSITORY"
        MARKER="<!-- vulnerability-scan-results-$REF -->"

        # --paginate: the endpoint returns 30 comments per page, and missing the
        # existing comment on a busy PR would post a duplicate.
        comment_id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" | tail -n 1)

        if [ -n "$comment_id" ]; then
          gh api "repos/$REPO/issues/comments/$comment_id" --method PATCH --field body=@/tmp/pr-comment.md
        else
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/pr-comment.md
        fi
