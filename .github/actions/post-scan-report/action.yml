name: "Post Security Scan Results"
description: "Posts security scan results as a PR comment, creating or updating an existing comment"

inputs:
  SEMGREP_OUTCOME:
    required: true
    description: "Outcome of the Semgrep SAST scan (success/failure/skipped)"
  INIT:
    required: false
    default: "true"
    description: "Whether the project uses an init container (omits the init Trivy row when false)"
  AGENT_SERVER:
    required: false
    default: "false"
    description: "Whether the agent-server image was built and scanned (adds the agent-server Trivy row when true)"
  REF:
    required: true
    description: "The branch/ref name used in the comment marker for deduplication"
  GITHUB_TOKEN:
    required: true
    description: "GitHub token for posting PR comments (requires pull-requests: write)"
  TRIVYIGNORE_PATH:
    required: false
    default: ""
    description: "The .trivyignore.yaml path passed to Trivy, used in ignore instructions"

runs:
  using: "composite"
  steps:
    - name: Compute ref slug
      id: ref-slug
      shell: bash
      env:
        REF: ${{ inputs.REF }}
      run: echo "slug=$(echo "$REF" | tr '/' '-')" >> "$GITHUB_OUTPUT"

    - name: Download scan results
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: scan-results-${{ steps.ref-slug.outputs.slug }}
        path: ./scan-results
      continue-on-error: true

    - name: Download Trivy results (dependencies)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-dependencies-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-dependencies
      continue-on-error: true

    - name: Download Trivy results (init)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-init-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-init
      continue-on-error: true

    - name: Download Trivy results (php)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-php-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-php
      continue-on-error: true

    - name: Download Trivy results (supervisord)
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-supervisord-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-supervisord
      continue-on-error: true

    - name: Download Trivy results (agent-server)
      if: inputs.AGENT_SERVER == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: trivy-results-agent-server-${{ steps.ref-slug.outputs.slug }}
        path: ./trivy-results-agent-server
      continue-on-error: true

    - name: Post security scan results to PR
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        # Inputs go through env rather than inline ${{ }} so the script is not
        # evaluated as one expression (GitHub caps those at 21000 chars) and so
        # the branch name in REF cannot inject shell code.
        SEMGREP_OUTCOME: ${{ inputs.SEMGREP_OUTCOME }}
        INIT: ${{ inputs.INIT }}
        AGENT_SERVER: ${{ inputs.AGENT_SERVER }}
        REF: ${{ inputs.REF }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        TRIVYIGNORE_PATH: ${{ inputs.TRIVYIGNORE_PATH }}
      run: |
        semgrep_outcome="$SEMGREP_OUTCOME"

        ignore_expiry=$(date -u -d '+90 days' +%F)

        project_path() {
          local path="${1#./}"
          echo "${path#./}"
        }

        print_trivy_ignore_hint() {
          local ignore_path advisory_id="${1:-CVE-xxxx-xxxxx}"
          ignore_path=$(project_path "${TRIVYIGNORE_PATH:-./.trivyignore.yaml}")
          printf '%s\n' '<details>' '<summary>How to ignore a vulnerability</summary>' ''
          printf '%s\n' "If a vulnerability does not affect this project, add it to \`$ignore_path\`:" ''
          printf '%s\n' '```yaml' 'vulnerabilities:' "  - id: $advisory_id" '    statement: Why this does not affect us' "    expired_at: $ignore_expiry" '```' ''
          if [ -z "$TRIVYIGNORE_PATH" ]; then
            printf '%s\n' "This workflow is not reading an ignore file yet: also pass \`TRIVYIGNORE_PATH: ./.trivyignore.yaml\` to the CI workflow." ''
          fi
          printf '%s\n' "The exception stops applying after \`expired_at\`." '' '</details>' ''
        }
        dependencies_outcome=$(cat ./trivy-results-dependencies/trivy-dependencies-status.txt 2>/dev/null || echo "unknown")
        php_outcome=$(cat ./trivy-results-php/trivy-php-status.txt 2>/dev/null || echo "unknown")
        supervisord_outcome=$(cat ./trivy-results-supervisord/trivy-supervisord-status.txt 2>/dev/null || echo "unknown")

        status_icon() {
          case "$1" in
            success) echo "✅ Passed" ;;
            failure) echo "❌ Failed" ;;
            skipped) echo "❌ Skipped" ;;
            *) echo "⚠️ Unknown" ;;
          esac
        }

        if [[ "$INIT" == "true" ]]; then
          init_outcome=$(cat ./trivy-results-init/trivy-init-status.txt 2>/dev/null || echo "unknown")
          labels=("Trivy (dependencies)" "Semgrep SAST" "Trivy (init image)" "Trivy (php image)" "Trivy (supervisord image)")
          outcomes=("$dependencies_outcome" "$semgrep_outcome" "$init_outcome" "$php_outcome" "$supervisord_outcome")
        else
          labels=("Trivy (dependencies)" "Semgrep SAST" "Trivy (php image)" "Trivy (supervisord image)")
          outcomes=("$dependencies_outcome" "$semgrep_outcome" "$php_outcome" "$supervisord_outcome")
        fi
        if [[ "$AGENT_SERVER" == "true" ]]; then
          agent_server_outcome=$(cat ./trivy-results-agent-server/trivy-agent-server-status.txt 2>/dev/null || echo "unknown")
          labels+=("Trivy (agent-server image)")
          outcomes+=("$agent_server_outcome")
        fi

        failure_count=0
        for i in "${!outcomes[@]}"; do
          if [ "${outcomes[$i]}" = "failure" ] || [ "${outcomes[$i]}" = "skipped" ]; then
            failure_count=$((failure_count + 1))
          fi
        done

        LOGS_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

        {
          echo "<!-- vulnerability-scan-results-$REF -->"
          echo "## Security Scan Results for $REF"
          echo ""

          if [ "$failure_count" -gt 0 ]; then
            echo "> [!CAUTION]"
            echo "> **$failure_count scan(s) failed** — action required. See below for what to fix."
          else
            echo "> [!TIP]"
            echo "> All scans passed — no immediate action required."
          fi
          echo ""

          echo "| Scan | Status |"
          echo "|------|--------|"
          for i in "${!labels[@]}"; do
            echo "| ${labels[$i]} | $(status_icon "${outcomes[$i]}") |"
          done

          if [ "$failure_count" -gt 0 ]; then
            echo ""
            echo "---"
            echo ""
            echo "_Refer to the [action logs]($LOGS_URL) for full scan output._"

            if [ "$semgrep_outcome" = "failure" ]; then
              echo ""
              echo "<details>"
              echo "<summary><strong>Semgrep SAST</strong></summary>"
              echo ""
              if [ -f "./scan-results/semgrep.json" ]; then
                rows=$(jq -r '
                  .results // [] |
                  map(select(.extra.severity == "ERROR" or .extra.severity == "WARNING")) |
                  sort_by(.extra.severity, .path, .start.line) |
                  .[] |
                  [
                    ("[" + (.check_id | split(".") | last) + "](https://semgrep.dev/r/" + .check_id + ")"),
                    .path,
                    (.start.line | tostring),
                    .extra.severity,
                    (.extra.message | gsub("[\n\r\t]"; " ") | .[0:300])
                  ] |
                  @tsv
                ' ./scan-results/semgrep.json 2>/dev/null || echo "")
                if [ -n "$rows" ]; then
                  echo "| Rule | Location | Severity | Message |"
                  echo "|------|----------|----------|---------|"
                  while IFS=$'\t' read -r rule file line severity message; do
                    echo "| $rule | \`$file:$line\` | $severity | $message |"
                  done <<< "$rows"
                  echo ""
                else
                  echo "Could not parse detailed results — refer to the [action logs]($LOGS_URL) for the flagged patterns and file locations."
                  echo ""
                fi
              else
                echo "Could not parse detailed results — refer to the [action logs]($LOGS_URL) for the flagged patterns and file locations."
                echo ""
              fi
              echo "</details>"
              echo ""
            fi

            trivy_names=("dependencies")
            trivy_labels=("Trivy (dependencies)")
            trivy_outcomes=("$dependencies_outcome")
            if [[ "$INIT" == "true" ]]; then
              trivy_names+=("init")
              trivy_labels+=("Trivy (init image)")
              trivy_outcomes+=("$init_outcome")
            fi
            trivy_names+=("php" "supervisord")
            trivy_labels+=("Trivy (php image)" "Trivy (supervisord image)")
            trivy_outcomes+=("$php_outcome" "$supervisord_outcome")
            if [[ "$AGENT_SERVER" == "true" ]]; then
              trivy_names+=("agent-server")
              trivy_labels+=("Trivy (agent-server image)")
              trivy_outcomes+=("$agent_server_outcome")
            fi
            trivy_failed=false
            trivy_ignore_id=""
            for j in "${!trivy_names[@]}"; do
              name="${trivy_names[$j]}"
              label="${trivy_labels[$j]}"
              t_outcome="${trivy_outcomes[$j]}"
              if [ "$t_outcome" = "failure" ] || [ "$t_outcome" = "skipped" ]; then
                echo ""
                echo "<details>"
                echo "<summary><strong>$label</strong></summary>"
                echo ""
                if [ "$t_outcome" = "skipped" ]; then
                  echo "The Trivy scan was skipped, likely because the Docker image build failed. Refer to the [action logs]($LOGS_URL) for details."
                  echo ""
                else
                  if [ "$name" = "dependencies" ]; then
                    echo "Update these packages in the listed lockfile (e.g. \`composer update <package>\` or \`npm update <package>\`)."
                  else
                    echo "These may contain OS-level package vulnerabilities that require updates (e.g. \`apt update <package>\`) to be added to the Dockerfile."
                  fi
                  echo ""
                  trivy_json="./trivy-results-${name}/trivy-${name}.json"
                  trivy_failed=true
                  if [ -z "$trivy_ignore_id" ]; then
                    trivy_ignore_id=$(jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | first // empty' "$trivy_json" 2>/dev/null || true)
                  fi
                  rows=""
                  if jq empty "$trivy_json" 2>/dev/null; then
                    rows=$(jq -r '
                    def norm(v):
                      (v // "" | ascii_downcase | ltrimstr("v")) as $s |
                      ($s | [scan("[0-9]+")] | map(tonumber)) as $parts |
                      ($parts + [0,0,0,0,0,0])[0:6];
                    def vcmp(a; b):
                      (norm(a)) as $a | (norm(b)) as $b |
                      ([range(0;6)] | map($a[.] - $b[.]) | map(select(. != 0)) | first) // 0;
                    def sev_rank: if . == "CRITICAL" then 0 elif . == "HIGH" then 1 else 2 end;
                    # FixedVersion lists one fix per release line ("5.0.10, 3.0.7, 2.1.5"); the
                    # relevant one is the lowest that is still above the installed version.
                    def min_fix:
                      .InstalledVersion as $installed |
                      (.FixedVersion // "" | split(",") | map(gsub("^ +| +$"; "")) | map(select(. != ""))) as $all |
                      ($all | map(select(vcmp(.; $installed) > 0)) | sort_by(norm(.)) | first) // ($all | first);
                    def advisory_link:
                      if (.VulnerabilityID | startswith("CVE-")) then "[\(.VulnerabilityID)](https://nvd.nist.gov/vuln/detail/\(.VulnerabilityID))"
                      elif (.VulnerabilityID | startswith("GHSA-")) then "[\(.VulnerabilityID)](https://github.com/advisories/\(.VulnerabilityID))"
                      elif .PrimaryURL then "[\(.VulnerabilityID)](\(.PrimaryURL))"
                      else .VulnerabilityID end;
                    [.Results[]? | . as $result | .Vulnerabilities[]? |
                      . + {Location: (if $result.Class == "os-pkgs"
                                      then (($result.Target | capture("\\((?<os>[^)]+)\\)$") | .os) // $result.Type)
                                      else ($result.Target | sub("/package\\.json$"; "")) end)}] |
                    group_by([.PkgName, .InstalledVersion, .Location]) |
                    map(
                      (map(.VulnerabilityID) | unique) as $ids |
                      (unique_by(.VulnerabilityID)) as $vulns |
                      {
                        pkg: .[0].PkgName,
                        installed: .[0].InstalledVersion,
                        location: .[0].Location,
                        severity: (map(.Severity) | min_by(sev_rank)),
                        # A single upgrade has to clear every advisory, hence the highest per-advisory fix.
                        fix: ([$vulns[] | min_fix] | map(select(. != null)) | sort_by(norm(.)) | last // "-"),
                        advisories: (($vulns[0:3] | map(advisory_link) | join(", ")) +
                                     (if ($ids | length) > 3 then " _+\(($ids | length) - 3) more_" else "" end))
                      }
                    ) |
                    sort_by((.severity | sev_rank), .pkg, .location) |
                    .[] |
                    [.pkg, .severity, .installed, .fix, .advisories, .location] |
                    @tsv
                    ' "$trivy_json" 2>/dev/null || echo "")
                  fi
                  if [ -n "$rows" ]; then
                    max_rows=50
                    row_count=$(wc -l <<< "$rows")
                    echo "| Package | Severity | Installed | Fix ≥ | Advisory | Location |"
                    echo "|---------|----------|-----------|-------|----------|----------|"
                    while IFS=$'\t' read -r pkg severity installed fix_ver advisories location; do
                      echo "| \`$pkg\` | $severity | \`$installed\` | \`$fix_ver\` | $advisories | \`$location\` |"
                    done <<< "$(head -n "$max_rows" <<< "$rows")"
                    if [ "$row_count" -gt "$max_rows" ]; then
                      echo ""
                      echo "_$((row_count - max_rows)) more package(s) — refer to the [action logs]($LOGS_URL) for the full output._"
                    fi
                    echo ""
                  else
                    echo "Could not parse detailed results — refer to the [action logs]($LOGS_URL)."
                    echo ""
                  fi
                fi
                echo "</details>"
                echo ""
              fi
            done
            if [ "$trivy_failed" = true ]; then
              echo ""
              print_trivy_ignore_hint "$trivy_ignore_id"
            fi
          fi

        } > /tmp/pr-comment.md

        # GitHub's comment body limit is 65536 chars — hard-truncate if still over
        if [ "$(wc -c < /tmp/pr-comment.md)" -gt 65000 ]; then
          { head -c 64800 /tmp/pr-comment.md; printf '\n\n---\n_Output truncated — [refer to action logs](%s) for full results._\n' "$LOGS_URL"; } > /tmp/pr-comment-truncated.md
          mv /tmp/pr-comment-truncated.md /tmp/pr-comment.md
        fi

        REPO="$GITHUB_REPOSITORY"
        MARKER="<!-- vulnerability-scan-results-$REF -->"

        comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\")))] | last | .id // empty")

        if [ -n "$comment_id" ]; then
          gh api "repos/$REPO/issues/comments/$comment_id" --method PATCH --field body=@/tmp/pr-comment.md
        else
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/pr-comment.md
        fi
