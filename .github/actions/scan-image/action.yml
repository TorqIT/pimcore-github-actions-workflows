name: "Scan image"
description: "Scans a built Docker image with Trivy for fixable HIGH and CRITICAL vulnerabilities, prints the results, uploads them as an artifact for the scan report and fails if any were found"
inputs:
  NAME:
    required: true
    description: "Short image name used in result file and artifact names (e.g. php, supervisord)"
  IMAGE_REF:
    required: true
    description: "The image reference to scan"
  ARTIFACT_SUFFIX:
    required: true
    description: "Suffix appended to the results artifact name, typically the ref slug"
  SKIP_SCAN:
    required: false
    default: "false"
    description: "When 'true' (e.g. the image build failed), skip Trivy but still record a 'skipped' outcome for the scan report"
  TRIVYIGNORE_PATH:
    required: false
    default: ""
    description: "Path to .trivyignore.yaml file (e.g. ./.trivyignore.yaml)"

runs:
  using: "composite"
  steps:
    - name: Free disk space before Trivy scan if needed
      if: inputs.SKIP_SCAN != 'true'
      shell: bash
      run: |
        FREE_GB=$(df / --output=avail -BG | tail -1 | tr -d 'G')
        if [ "$FREE_GB" -lt 10 ]; then
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo swapoff -a && sudo rm -f /swapfile
        fi

    - name: Run Trivy vulnerability scanner on image
      id: trivy-scan
      if: inputs.SKIP_SCAN != 'true'
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        # Keep in step with the Trivy server Dependency-Track analyses SBOMs with, so CI and Dependency-Track agree
        version: "v0.76.2"
        image-ref: ${{ inputs.IMAGE_REF }}
        # Composer packages ship package.json files for their prebuilt assets with placeholder versions (often 0.0.1);
        # they're already covered by the Composer package version, and npm lockfile dependencies are scanned separately
        skip-files: "**/vendor/**/package.json,**/bundles/**/package.json"
        format: "json"
        output: "trivy-${{ inputs.NAME }}.json"
        exit-code: "1"
        ignore-unfixed: true
        vuln-type: "os,library"
        scanners: "vuln"
        severity: "CRITICAL,HIGH"
        trivyignores: ${{ inputs.TRIVYIGNORE_PATH }}
        timeout: "15m"

    - name: Print Trivy results to log
      if: always()
      shell: bash
      env:
        TRIVY_TABLE_MODE: detailed
        RESULTS_FILE: trivy-${{ inputs.NAME }}.json
      run: |
        if [ -f "$RESULTS_FILE" ]; then
          trivy convert --format table "$RESULTS_FILE" || cat "$RESULTS_FILE"
        fi

    - name: Record Trivy outcome
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.trivy-scan.outcome }}
        STATUS_FILE: trivy-${{ inputs.NAME }}-status.txt
      run: echo "$OUTCOME" > "$STATUS_FILE"

    - name: Upload Trivy results artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: trivy-results-${{ inputs.NAME }}-${{ inputs.ARTIFACT_SUFFIX }}
        path: |
          trivy-${{ inputs.NAME }}.json
          trivy-${{ inputs.NAME }}-status.txt
        if-no-files-found: ignore

    - name: Fail if Trivy found vulnerabilities
      if: steps.trivy-scan.outcome == 'failure'
      shell: bash
      env:
        NAME: ${{ inputs.NAME }}
      run: |
        echo "Trivy found CRITICAL or HIGH vulnerabilities in the $NAME image"
        exit 1
