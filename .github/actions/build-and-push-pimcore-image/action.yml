name: "Build and Push Pimcore Image"
description: "Builds a Pimcore Docker image, and optionally pushes it to a Container Registry"
inputs:
  CONTAINER_REGISTRY:
    required: false
    description: "The Docker registry to push the image to"
  PUSH:
    required: false
    description: "Whether to push the image to the registry"
    default: "true"
  CACHE_FROM:
    required: false
    description: "Defines where to pull cached Docker layers from"
  CACHE_TO:
    required: false
    description: "Defines where to push cached Docker layers to"
  TAGS:
    required: false
    description: "Defines the tags to associate with the image"
  DOCKERFILE_PATH:
    required: true
    description: "The path (relative to the project's root) of the Dockerfile used to build image"
  DOCKERFILE_TARGET:
    required: true
    description: "The Docker target to use when building the image"
  IMAGE:
    required: true
    description: "The name of the Docker image to build"
  PIMCORE_ROOT:
    required: true
    description: "The path (relative to the project's root) in which the Pimcore files are stored (e.g. config, src, etc)"
  FRONTEND_ROOT:
    required: true
    description: "The path (relative to the project's root) in which the project's frontend files are stored"
  PIMCORE_ENTERPRISE_TOKEN:
    required: false
    description: "(Optional) The value of your project's Pimcore Enterprise Token"
  PIMCORE_PRODUCT_KEY:
    required: false
    description: (Optional) The Pimcore product key for the project
  PIMCORE_INSTANCE_IDENTIFIER:
    required: false
    description: (Optional) The Pimcore instance identifier for the project
  PIMCORE_ENCRYPTION_SECRET:
    required: false
    description: (Optional) The Pimcore encryption secret for the project
  TORQ_GITHUB_TOKEN:
    required: false
    description: "(Optional) A GitHub access token used to access private GitHub repositories"
  BUILD_TIME_ARGS:
    required: false
    description: "(Optional) A JSON object containing a list of args and their values in key: value format"
  BUILD_TIME_SECRETS:
    required: false
    description: "(Optional) A JSON object containing a list of secrets and their values in key: value format"
  NPM_BUILD:
    required: false
    default: "false"
    description: "Whether an NPM build should be run prior to building the PHP image"
  NPM_RUN_CMD:
    required: false
    description: "The NPM command that should be run prior to building the PHP image"
  NPM_SPA:
    required: false
    description: "Whether the NPM build results in a single-page application"
  SPA_TWIG:
    required: false
    description: "The path to the Twig file where the result of the NPM single-page application build should be copied"
  RECAPTCHA_CLIENT_KEY:
    required: false
    description: "(Optional) A client key used when building NPM frontends that require ReCAPTCHA"
  LOAD:
    required: false
    description: "Whether to load the built image into the local Docker cache"
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.NPM_BUILD == 'true'
      with:
        node-version: 20
        cache: "npm"
        cache-dependency-path: ${{ inputs.FRONTEND_ROOT }}/package-lock.json

    - name: Cache node modules
      if: inputs.NPM_BUILD == 'true'
      id: cache-npm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Perform npm build
      shell: bash
      if: inputs.NPM_BUILD == 'true'
      env:
        CI: "" # required to ensure warnings aren't treated as errors
      run: |
        # If the application supports ReCAPTCHA, ensure the client key is present so that it is available for the constructed SPA HTML file
        export VITE_RECAPTCHA_CLIENT_KEY=${{ inputs.RECAPTCHA_CLIENT_KEY }}
        export REACT_APP_RECAPTCHA_CLIENT_KEY=${{ inputs.RECAPTCHA_CLIENT_KEY }}
        npm --prefix ${{ inputs.FRONTEND_ROOT }} ci --legacy-peer-deps
        npm --prefix ${{ inputs.FRONTEND_ROOT }} run ${{ inputs.NPM_RUN_CMD }}
        if ${{ inputs.NPM_SPA }}
        then
          mv ${{ inputs.FRONTEND_ROOT }}/build/index.html ${{ inputs.PIMCORE_ROOT }}/templates/${{ inputs.SPA_TWIG }}
          mv ${{ inputs.FRONTEND_ROOT }}/build/* ${{ inputs.PIMCORE_ROOT }}/public/
        fi

    - name: Prepare Docker build args
      id: build-args
      run: |
        set -e
        JSON_INPUT='${{ inputs.BUILD_TIME_ARGS }}'
        echo "args<<EOF" >> $GITHUB_OUTPUT
        echo "$JSON_INPUT" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
          echo "$key=$value" >> $GITHUB_OUTPUT
        done
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Prepare Docker build secrets
      id: build-secrets
      run: |
        set -e
        echo "secrets<<EOF" >> $GITHUB_OUTPUT

        add_secret() {
          local key="$1" value="$2"
          local var_name="SECRET_$(echo "$key" | tr 'a-z-' 'A-Z_')"
          echo "$var_name=$value" >> $GITHUB_ENV
          echo "id=$key,env=$var_name" >> $GITHUB_OUTPUT
        }

        add_secret "kernel-secret" "secret"
        add_secret "pimcore-product-key" "${{ inputs.PIMCORE_PRODUCT_KEY }}"
        add_secret "pimcore-instance-identifier" "${{ inputs.PIMCORE_INSTANCE_IDENTIFIER }}"
        add_secret "pimcore-encryption-secret" "${{ inputs.PIMCORE_ENCRYPTION_SECRET }}"
        add_secret "pimcore-enterprise-token" "${{ inputs.PIMCORE_ENTERPRISE_TOKEN }}"
        add_secret "torq-github-token" "${{ inputs.TORQ_GITHUB_TOKEN }}"

        JSON_INPUT='${{ inputs.BUILD_TIME_SECRETS }}'
        echo "$JSON_INPUT" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
          echo "::add-mask::$value"   # Mask the value from logs
          add_secret "$key" "$value"
        done

        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build and push image
      shell: bash
      run: |
        set -uo pipefail

        ARGS=(buildx build --file '${{ inputs.DOCKERFILE_PATH }}' --target '${{ inputs.DOCKERFILE_TARGET }}')
        while IFS= read -r line; do [ -n "$line" ] && ARGS+=(--cache-from "$line"); done <<< '${{ inputs.CACHE_FROM }}'
        while IFS= read -r line; do [ -n "$line" ] && ARGS+=(--cache-to "$line"); done <<< '${{ inputs.CACHE_TO }}'
        # Tags may be comma- and/or newline-separated (e.g. "tag1,\ntag2"), so split on both.
        while IFS= read -r line; do line="$(echo "$line" | xargs)"; [ -n "$line" ] && ARGS+=(--tag "$line"); done <<< "$(tr ',' '\n' <<< '${{ inputs.TAGS }}')"
        while IFS= read -r line; do [ -n "$line" ] && ARGS+=(--build-arg "$line"); done <<< '${{ steps.build-args.outputs.args }}'
        while IFS= read -r line; do [ -n "$line" ] && ARGS+=(--secret "$line"); done <<< '${{ steps.build-secrets.outputs.secrets }}'
        [ '${{ inputs.PUSH }}' = "true" ] && ARGS+=(--push)
        [ '${{ inputs.LOAD }}' = "true" ] && ARGS+=(--load)
        ARGS+=(".")

        # Failures matching these patterns look like transient network/API errors, 
        # so we retry them on failure
        TRANSIENT_FAILURE_PATTERN='(^|[^0-9])50[234]([^0-9]|$)|Gateway Time-?out|i/o timeout|TLS handshake timeout|connection reset by peer|context deadline exceeded|unexpected EOF|Temporary failure in name resolution|Could not resolve host|net/http: request canceled|connect: connection refused|timeout awaiting response headers'
        LOGFILE="${RUNNER_TEMP:-/tmp}/docker-build.log"
        for attempt in 1 2 3; do
          docker "${ARGS[@]}" 2>&1 | tee "$LOGFILE"
          status="${PIPESTATUS[0]}"
          [ "$status" -eq 0 ] && exit 0
          if [ "$attempt" -lt 3 ] && grep -qEi "$TRANSIENT_FAILURE_PATTERN" "$LOGFILE"; then
            echo "Build failed with what looks like a transient error (attempt $attempt/3) — retrying..." >&2
            continue
          fi

          exit "$status"
        done
