name: "Build and Push Pimcore Image"
description: "Builds a Pimcore Docker image, and optionally pushes it to a Container Registry"
inputs:
  CONTAINER_REGISTRY:
    required: false
    description: "The Docker registry to push the image to"
  PUSH:
    required: false
    description: "Whether to push the image to the registry"
    default: "true"
  CACHE_FROM:
    required: false
    description: "Defines where to pull cached Docker layers from"
  CACHE_TO:
    required: false
    description: "Defines where to push cached Docker layers to"
  TAGS:
    required: false
    description: "Defines the tags to associate with the image"
  DOCKERFILE_PATH:
    required: true
    description: "The path (relative to the project's root) of the Dockerfile used to build image"
  DOCKERFILE_TARGET:
    required: true
    description: "The Docker target to use when building the image"
  IMAGE:
    required: true
    description: "The name of the Docker image to build"
  PIMCORE_ROOT:
    required: true
    description: "The path (relative to the project's root) in which the Pimcore files are stored (e.g. config, src, etc)"
  FRONTEND_ROOT:
    required: true
    description: "The path (relative to the project's root) in which the project's frontend files are stored"
  PIMCORE_ENTERPRISE_TOKEN:
    required: false
    description: "(Optional) The value of your project's Pimcore Enterprise Token"
  PIMCORE_PRODUCT_KEY:
    required: false
    description: (Optional) The Pimcore product key for the project
  PIMCORE_INSTANCE_IDENTIFIER:
    required: false
    description: (Optional) The Pimcore instance identifier for the project
  PIMCORE_ENCRYPTION_SECRET:
    required: false
    description: (Optional) The Pimcore encryption secret for the project
  TORQ_GITHUB_TOKEN:
    required: false
    description: "(Optional) A GitHub access token used to access private GitHub repositories"
  BUILD_TIME_ARGS:
    required: false
    description: "(Optional) A JSON object containing a list of args and their values in key: value format"
  BUILD_TIME_SECRETS:
    required: false
    description: "(Optional) A JSON object containing a list of secrets and their values in key: value format"
  NPM_BUILD:
    required: false
    default: "false"
    description: "Whether an NPM build should be run prior to building the PHP image"
  NPM_RUN_CMD:
    required: false
    description: "The NPM command that should be run prior to building the PHP image"
  NPM_SPA:
    required: false
    description: "Whether the NPM build results in a single-page application"
  SPA_TWIG:
    required: false
    description: "The path to the Twig file where the result of the NPM single-page application build should be copied"
  RECAPTCHA_CLIENT_KEY:
    required: false
    description: "(Optional) A client key used when building NPM frontends that require ReCAPTCHA"
  LOAD:
    required: false
    description: "Whether to load the built image into the local Docker cache"
    default: "false"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: inputs.NPM_BUILD == 'true'
      with:
        node-version: 20
        cache: "npm"
        cache-dependency-path: ${{ inputs.FRONTEND_ROOT }}/package-lock.json

    - name: Cache node modules
      if: inputs.NPM_BUILD == 'true'
      id: cache-npm
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.npm
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-build-
          ${{ runner.os }}-

    - name: Perform npm build
      shell: bash
      if: inputs.NPM_BUILD == 'true'
      env:
        CI: "" # required to ensure warnings aren't treated as errors
      run: |
        # If the application supports ReCAPTCHA, ensure the client key is present so that it is available for the constructed SPA HTML file
        export VITE_RECAPTCHA_CLIENT_KEY=${{ inputs.RECAPTCHA_CLIENT_KEY }}
        export REACT_APP_RECAPTCHA_CLIENT_KEY=${{ inputs.RECAPTCHA_CLIENT_KEY }}
        npm --prefix ${{ inputs.FRONTEND_ROOT }} ci --legacy-peer-deps
        npm --prefix ${{ inputs.FRONTEND_ROOT }} run ${{ inputs.NPM_RUN_CMD }}
        if ${{ inputs.NPM_SPA }}
        then
          mv ${{ inputs.FRONTEND_ROOT }}/build/index.html ${{ inputs.PIMCORE_ROOT }}/templates/${{ inputs.SPA_TWIG }}
          mv ${{ inputs.FRONTEND_ROOT }}/build/* ${{ inputs.PIMCORE_ROOT }}/public/
        fi

    - name: Prepare Docker build args
      id: build-args
      run: |
        set -e
        JSON_INPUT='${{ inputs.BUILD_TIME_ARGS }}'
        echo "args<<EOF" >> $GITHUB_OUTPUT
        echo "$JSON_INPUT" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
          echo "$key=$value" >> $GITHUB_OUTPUT
        done
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    - name: Prepare Docker build secrets
      id: build-secrets
      run: |
        set -e
        JSON_INPUT='${{ inputs.BUILD_TIME_SECRETS }}'
        echo "secrets<<EOF" >> $GITHUB_OUTPUT
        echo "$JSON_INPUT" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r key value; do
          echo "::add-mask::$value"   # Mask the value from logs
          echo "$key=$value" >> $GITHUB_OUTPUT
        done
        echo "EOF" >> $GITHUB_OUTPUT
      shell: bash

    # Invoked as a raw `docker buildx build` (rather than docker/build-push-action) so that on
    # failure we can grep the build log for signs of a transient error (e.g. GitHub API 504s hit
    # while Composer/npm fetch dependencies) and retry, instead of failing the whole job outright.
    - name: Build and push image
      shell: bash
      env:
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE_PATH }}
        DOCKERFILE_TARGET: ${{ inputs.DOCKERFILE_TARGET }}
        IMAGE_TAGS: ${{ inputs.TAGS }}
        CACHE_FROM: ${{ inputs.CACHE_FROM }}
        CACHE_TO: ${{ inputs.CACHE_TO }}
        PUSH: ${{ inputs.PUSH }}
        LOAD: ${{ inputs.LOAD }}
        BUILD_ARGS: ${{ steps.build-args.outputs.args }}
        # During the build, several secret values don't actually matter but still need to be present (e.g. kernel-secret),
        # so we simply add dummy values here
        SECRET_KERNEL_SECRET: secret
        SECRET_PIMCORE_PRODUCT_KEY: ${{ inputs.PIMCORE_PRODUCT_KEY }}
        SECRET_PIMCORE_INSTANCE_IDENTIFIER: ${{ inputs.PIMCORE_INSTANCE_IDENTIFIER }}
        SECRET_PIMCORE_ENCRYPTION_SECRET: ${{ inputs.PIMCORE_ENCRYPTION_SECRET }}
        SECRET_PIMCORE_ENTERPRISE_TOKEN: ${{ inputs.PIMCORE_ENTERPRISE_TOKEN }}
        SECRET_TORQ_GITHUB_TOKEN: ${{ inputs.TORQ_GITHUB_TOKEN }}
        DYNAMIC_SECRETS: ${{ steps.build-secrets.outputs.secrets }}
      run: |
        set -uo pipefail

        ARGS=(buildx build --file "$DOCKERFILE_PATH" --target "$DOCKERFILE_TARGET")

        append_multiline() {
          local flag="$1" value="$2"
          [ -z "$value" ] && return
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            ARGS+=("$flag" "$line")
          done <<< "$value"
        }

        append_multiline --cache-from "$CACHE_FROM"
        append_multiline --cache-to "$CACHE_TO"
        append_multiline --tag "$IMAGE_TAGS"
        append_multiline --build-arg "$BUILD_ARGS"

        add_secret() {
          local id="$1" value="$2"
          local var_name="SECRET_ENV_$(echo "$id" | tr 'a-z-' 'A-Z_')"
          export "$var_name"="$value"
          ARGS+=(--secret "id=$id,env=$var_name")
        }

        add_secret "kernel-secret" "$SECRET_KERNEL_SECRET"
        add_secret "pimcore-product-key" "$SECRET_PIMCORE_PRODUCT_KEY"
        add_secret "pimcore-instance-identifier" "$SECRET_PIMCORE_INSTANCE_IDENTIFIER"
        add_secret "pimcore-encryption-secret" "$SECRET_PIMCORE_ENCRYPTION_SECRET"
        add_secret "pimcore-enterprise-token" "$SECRET_PIMCORE_ENTERPRISE_TOKEN"
        add_secret "torq-github-token" "$SECRET_TORQ_GITHUB_TOKEN"

        if [ -n "$DYNAMIC_SECRETS" ]; then
          while IFS='=' read -r key value; do
            [ -z "$key" ] && continue
            add_secret "$key" "$value"
          done <<< "$DYNAMIC_SECRETS"
        fi

        [ "$PUSH" = "true" ] && ARGS+=(--push)
        [ "$LOAD" = "true" ] && ARGS+=(--load)

        ARGS+=(".")

        # Failures matching these patterns look like transient network/API blips (e.g. GitHub's
        # api.github.com returning 504s to Composer/npm mid-build) rather than a real build error,
        # so they're worth a few retries; anything else fails fast.
        TRANSIENT_PATTERN='(^|[^0-9])50[234]([^0-9]|$)|Gateway Time-?out|i/o timeout|TLS handshake timeout|connection reset by peer|context deadline exceeded|unexpected EOF|Temporary failure in name resolution|Could not resolve host|net/http: request canceled|connect: connection refused|timeout awaiting response headers'

        MAX_ATTEMPTS=3
        BACKOFF=(10 20)
        LOGFILE="${RUNNER_TEMP:-/tmp}/docker-build.log"

        attempt=1
        while true; do
          echo "::group::docker buildx build (attempt $attempt/$MAX_ATTEMPTS)"
          docker "${ARGS[@]}" 2>&1 | tee "$LOGFILE"
          status="${PIPESTATUS[0]}"
          echo "::endgroup::"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
            echo "Build failed after $MAX_ATTEMPTS attempts." >&2
            exit "$status"
          fi

          if grep -qEi "$TRANSIENT_PATTERN" "$LOGFILE"; then
            delay="${BACKOFF[$((attempt - 1))]}"
            echo "Build failed with what looks like a transient error (attempt $attempt/$MAX_ATTEMPTS) — retrying in ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
          else
            echo "Build failed with a non-transient-looking error — not retrying." >&2
            exit "$status"
          fi
        done
