name: "Build and Push Agent Server Image"
description: "Resolves the pimcore/pimcore-agent-bundle version from the project's composer.json, downloads just that package, and builds/pushes its agent-server Docker image"
inputs:
  PIMCORE_ROOT:
    required: true
    description: "The path (relative to the project's root) in which the Pimcore files are stored (e.g. config, src, composer.json)"
  PIMCORE_ENTERPRISE_TOKEN:
    required: true
    description: "The value of your project's Pimcore Enterprise Token, used to authenticate against the private repo.pimcore.com Composer registry"
  CONTAINER_REGISTRY:
    required: true
    description: "The Docker registry to push the image to"
  IMAGE:
    required: false
    default: "agent-server"
    description: "The name of the Docker image to build"
  PUSH:
    required: false
    default: "true"
    description: "Whether to push the image to the registry"
  CACHE_FROM:
    required: false
    description: "Defines where to pull cached Docker layers from"
  CACHE_TO:
    required: false
    description: "Defines where to push cached Docker layers to"
  LOAD:
    required: false
    default: "false"
    description: "Whether to load the built image into the local Docker cache"
outputs:
  VERSION:
    description: "The pimcore/pimcore-agent-bundle version that was built, as read from composer.json"
    value: ${{ steps.agent-bundle-version.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Determine pimcore-agent-bundle version from composer.json
      id: agent-bundle-version
      shell: bash
      run: |
        set -euo pipefail
        # Read from composer.json rather than composer.lock - not every project (e.g. pimcore-skeleton)
        # commits a lock file, so composer.json's constraint is the only reliably-present source.
        # This bundle is always required pinned to an exact version, so the constraint is directly
        # usable as-is.
        version=$(jq -r '.require["pimcore/pimcore-agent-bundle"] // empty' ${{ inputs.PIMCORE_ROOT }}/composer.json)
        if [ -z "$version" ]; then
          echo "::error::pimcore/pimcore-agent-bundle was not found in ${{ inputs.PIMCORE_ROOT }}/composer.json"
          exit 1
        fi
        echo "Found pimcore/pimcore-agent-bundle $version in composer.json"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Download pimcore-agent-bundle at the version required in composer.json
      shell: bash
      run: |
        set -euo pipefail
        composer config --global --auth http-basic.repo.pimcore.com token "${{ inputs.PIMCORE_ENTERPRISE_TOKEN }}"
        mkdir -p agent-bundle-fetch
        composer init --working-dir=agent-bundle-fetch --no-interaction --name=torq/agent-bundle-fetch --stability=beta
        composer config --working-dir=agent-bundle-fetch repositories.torq-it composer https://repo.pimcore.com/307-torq-it
        composer require --working-dir=agent-bundle-fetch --no-interaction --no-progress --no-scripts --ignore-platform-reqs \
          "pimcore/pimcore-agent-bundle:${{ steps.agent-bundle-version.outputs.version }}"

    - name: Build and push image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: agent-bundle-fetch/vendor/pimcore/pimcore-agent-bundle/agent-server
        push: ${{ inputs.PUSH == 'true' }}
        cache-from: ${{ inputs.CACHE_FROM }}
        cache-to: ${{ inputs.CACHE_TO }}
        load: ${{ inputs.LOAD == 'true' }}
        tags: |
          ${{ inputs.CONTAINER_REGISTRY }}/${{ inputs.IMAGE }}:latest
          ${{ inputs.CONTAINER_REGISTRY }}/${{ inputs.IMAGE }}:${{ github.run_id }}
          ${{ inputs.CONTAINER_REGISTRY }}/${{ inputs.IMAGE }}:${{ steps.agent-bundle-version.outputs.version }}
