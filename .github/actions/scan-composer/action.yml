name: "Scan Composer dependencies"
description: "Runs composer audit (non-dev dependencies) against the project's composer.lock, honouring config.audit.ignore. Fails when an unignored HIGH or CRITICAL advisory is found or dependencies cannot be resolved. Writes results to /tmp for the scan report."
inputs:
  PIMCORE_ROOT:
    required: true
    description: "The path (relative to the project's root) in which the Pimcore files exist"
  PIMCORE_ENTERPRISE_TOKEN:
    required: false
    default: ""
    description: "Pimcore Enterprise token for repo.pimcore.com; falls back to pimcore-enterprise-token in BUILD_TIME_SECRETS"
  REPMAN_CLIENT_TOKEN:
    required: false
    default: ""
    description: "Repman token; falls back to repman-client-token in BUILD_TIME_SECRETS"
  BUILD_TIME_SECRETS:
    required: false
    default: ""
    description: "JSON object containing build-time secrets in key: value format"

runs:
  using: "composite"
  steps:
    - name: Scan for composer vulnerabilities
      shell: bash
      env:
        PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}
        PIMCORE_ENTERPRISE_TOKEN: ${{ inputs.PIMCORE_ENTERPRISE_TOKEN }}
        REPMAN_CLIENT_TOKEN: ${{ inputs.REPMAN_CLIENT_TOKEN }}
        BUILD_TIME_SECRETS: ${{ inputs.BUILD_TIME_SECRETS }}
      run: |
        if [[ -z "$PIMCORE_ENTERPRISE_TOKEN" ]]; then
          PIMCORE_ENTERPRISE_TOKEN=$(printf '%s' "$BUILD_TIME_SECRETS" | jq -r '."pimcore-enterprise-token" // empty' 2>/dev/null || true)
        fi
        if [[ -n "$PIMCORE_ENTERPRISE_TOKEN" ]]; then
          echo "::add-mask::$PIMCORE_ENTERPRISE_TOKEN"
          composer --working-dir="$PIMCORE_ROOT" config --global --auth http-basic.repo.pimcore.com token "$PIMCORE_ENTERPRISE_TOKEN"
        fi
        if [[ -z "$REPMAN_CLIENT_TOKEN" ]]; then
          REPMAN_CLIENT_TOKEN=$(printf '%s' "$BUILD_TIME_SECRETS" | jq -r '."repman-client-token" // empty' 2>/dev/null || true)
        fi
        if [[ -n "$REPMAN_CLIENT_TOKEN" ]]; then
          echo "::add-mask::$REPMAN_CLIENT_TOKEN"
          REPMAN_HOST=$(jq -r '.repositories // [] | map(select(.url // "" | contains("repman.io"))) | .[0].url // "" | ltrimstr("https://") | ltrimstr("http://") | rtrimstr("/")' "$PIMCORE_ROOT/composer.json" 2>/dev/null || true)
          if [[ -n "$REPMAN_HOST" ]]; then
            composer --working-dir="$PIMCORE_ROOT" config --global --auth http-basic.$REPMAN_HOST token "$REPMAN_CLIENT_TOKEN"
          fi
        fi
        install_exit=0
        if [ ! -f "$PIMCORE_ROOT/composer.lock" ]; then
          set +e
          composer --working-dir="$PIMCORE_ROOT" install --prefer-dist --no-scripts --ignore-platform-reqs > /tmp/composer-install.txt 2>&1
          install_exit=$?
          set -e
          cat /tmp/composer-install.txt
        fi
        {
          cat /tmp/composer-install.txt 2>/dev/null || true
          composer --working-dir="$PIMCORE_ROOT" audit --abandoned=report --locked --no-dev --format=json > /tmp/composer-audit.json 2>/dev/null || true
          composer --working-dir="$PIMCORE_ROOT" audit --abandoned=report --locked --no-dev || true
          jq '[.packages[] | {name, version}]' "$PIMCORE_ROOT/composer.lock" > /tmp/composer-packages.json 2>/dev/null || echo '[]' > /tmp/composer-packages.json
        } 2>&1 | tee /tmp/composer-audit.txt || true
        echo "$install_exit" > /tmp/composer-install-exit.txt
        [ "$install_exit" -eq 0 ] || exit 1
        high_critical_count=$(jq '[.advisories // {} | to_entries[] | .value[] | select(.ignored != true and (.severity == "high" or .severity == "critical"))] | length' /tmp/composer-audit.json 2>/dev/null || echo 0)
        [ "$high_critical_count" -eq 0 ]
