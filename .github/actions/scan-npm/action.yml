name: "Scan npm dependencies"
description: "Audits production dependencies of every package-lock.json in the project with better-npm-audit, so exceptions in a project's .nsprc are honoured. Fails when an unexcepted, fixable HIGH or CRITICAL vulnerability is found. Writes results to /tmp for the scan report."

runs:
  using: "composite"
  steps:
    - name: Install better-npm-audit
      shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund --prefix "$GITHUB_ACTION_PATH/better-npm-audit"

    - name: Scan for npm vulnerabilities
      shell: bash
      run: |
        better_npm_audit="$GITHUB_ACTION_PATH/better-npm-audit/node_modules/.bin/better-npm-audit"
        result=0
        > /tmp/npm-audit.txt
        while IFS= read -r -d '' f; do
          dir=$(dirname "$f")
          dir_slug=$(echo "$dir" | sed 's|^\./||;s|/|__|g')
          slug=${dir_slug:-root}
          echo "--- Scanning $dir ---" | tee -a /tmp/npm-audit.txt
          (cd "$dir" && "$better_npm_audit" audit --production --json) \
            > "/tmp/npm-bna-$slug.json" 2> "/tmp/npm-bna-$slug.log" || true
          tee -a /tmp/npm-audit.txt < "/tmp/npm-bna-$slug.log"
          bna_error=$(jq -r 'if has("vulnerabilities") then empty else (.error // "no result") end' "/tmp/npm-bna-$slug.json" 2>/dev/null || echo "output is not valid JSON")
          bna_file="/tmp/npm-bna-$slug.json"
          if [ -n "$bna_error" ]; then
            echo "::error::better-npm-audit failed in $dir: $bna_error" | tee -a /tmp/npm-audit.txt
            bna_file=/dev/null
            result=1
          fi
          # The report is built from npm's own audit JSON (it needs fixAvailable and the
          # dependency chain); _excepted lists the advisories better-npm-audit excepted.
          npm audit --json --omit=dev --prefix "$dir" 2>/dev/null \
            | jq --arg dir "$dir" --slurpfile bna "$bna_file" \
                '. + {_scannedDir: $dir, _excepted: [$bna[0].vulnerabilities[]? | select(.excepted) | .url] | unique}' \
            > "/tmp/npm-raw-$slug.json" || true
          # Include nested copies (keyed by lockfile path) so the report can show
          # the version npm actually flagged rather than only the hoisted one.
          jq '[.packages // {} | to_entries[] | select(.key | test("(^|/)node_modules/(@[^/]+/[^/]+|[^/]+)$")) | {path: .key, name: (.key | sub("^.*node_modules/"; "")), version: .value.version}]' \
            "$dir/package-lock.json" > "/tmp/npm-packages-$slug.json" 2>/dev/null || echo '[]' > "/tmp/npm-packages-$slug.json"
          [ -n "$bna_error" ] && continue
          fixable_count=$(jq '[.vulnerabilities[] | select((.excepted | not) and (.severity == "high" or .severity == "critical") and .fix != "No")] | length' "/tmp/npm-bna-$slug.json")
          if [ "$fixable_count" -gt 0 ]; then
            result=1
          else
            echo "No unexcepted fixable high/critical vulnerabilities found" | tee -a /tmp/npm-audit.txt
          fi
        done < <(find . -name "package-lock.json" -not -path "*/node_modules/*" -not -path "./reusable-workflow/*" -print0)
        exit $result
