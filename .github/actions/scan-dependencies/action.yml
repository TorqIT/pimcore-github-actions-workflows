name: "Scan dependencies"
description: "Scans the project's lockfiles (composer.lock, package-lock.json, etc.) with Trivy for fixable HIGH and CRITICAL vulnerabilities in production dependencies, prints the results, uploads them as an artifact for the scan report and fails if any were found"
inputs:
  ARTIFACT_SUFFIX:
    required: true
    description: "Suffix appended to the results artifact name, typically the ref slug"
  TRIVYIGNORE_PATH:
    required: false
    default: ""
    description: "Path to .trivyignore.yaml file (e.g. ./.trivyignore.yaml)"

runs:
  using: "composite"
  steps:
    - name: Run Trivy vulnerability scanner on lockfiles
      id: trivy-scan
      continue-on-error: true
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        # Keep in step with the Trivy server Dependency-Track analyses SBOMs with, so CI and Dependency-Track agree
        version: "v0.76.2"
        scan-type: "fs"
        scan-ref: "."
        format: "json"
        output: "trivy-dependencies.json"
        exit-code: "1"
        ignore-unfixed: true
        scanners: "vuln"
        severity: "CRITICAL,HIGH"
        # The workflow repository is checked out into reusable-workflow; vendor and node_modules hold installed copies of
        # what the lockfiles already describe
        skip-dirs: "reusable-workflow,**/vendor,**/node_modules"
        trivyignores: ${{ inputs.TRIVYIGNORE_PATH }}
        timeout: "15m"

    - name: Print Trivy results to log
      if: always()
      shell: bash
      env:
        TRIVY_TABLE_MODE: detailed
        RESULTS_FILE: trivy-dependencies.json
      run: |
        if [ -f "$RESULTS_FILE" ]; then
          trivy convert --format table "$RESULTS_FILE" || cat "$RESULTS_FILE"
        fi

    - name: Record Trivy outcome
      if: always()
      shell: bash
      env:
        OUTCOME: ${{ steps.trivy-scan.outcome }}
      run: echo "$OUTCOME" > trivy-dependencies-status.txt

    - name: Upload Trivy results artifact
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: trivy-results-dependencies-${{ inputs.ARTIFACT_SUFFIX }}
        path: |
          trivy-dependencies.json
          trivy-dependencies-status.txt
        if-no-files-found: ignore

    - name: Fail if Trivy found vulnerabilities
      if: steps.trivy-scan.outcome == 'failure'
      shell: bash
      run: |
        echo "Trivy found CRITICAL or HIGH vulnerabilities in the project's dependencies"
        exit 1
