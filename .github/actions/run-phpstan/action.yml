name: "Run PHPStan"
description: "Runs PHPStan static analysis inside the built PHP image, which already has Pimcore's generated Data Object classes on the autoloader"
inputs:
  DOCKERFILE:
    description: "Path to Dockerfile"
    required: true
  DOCKERFILE_TARGET:
    description: "Build target in Dockerfile"
    required: true
  BUILD_TIME_ARGS:
    required: true
    description: "A JSON object containing a list of args and their values in key: value format"
  BUILD_TIME_SECRETS:
    required: true
    description: "JSON object containing a list of build-time secrets and their values in key: value format"
  PIMCORE_ROOT:
    required: true
    description: "The path (relative to the project's root) in which the Pimcore files exist"
  PIMCORE_ENTERPRISE_TOKEN:
    required: false
    description: "The value of your project's Pimcore Enterprise Token"
  PIMCORE_PRODUCT_KEY:
    required: false
    description: (Optional) The Pimcore product key for the project
  PIMCORE_INSTANCE_IDENTIFIER:
    required: false
    description: (Optional) The Pimcore instance identifier for the project
  PIMCORE_ENCRYPTION_SECRET:
    required: false
    description: (Optional) The Pimcore encryption secret for the project
  TORQ_GITHUB_TOKEN:
    required: false
    description: "A GitHub access token used to access private GitHub repositories"
  PHPSTAN_ARGS:
    required: false
    default: ""
    description: "Additional arguments to append to the phpstan analyse command"

runs:
  using: "composite"
  steps:
    - name: Build image
      uses: ./reusable-workflow/.github/actions/build-and-push-pimcore-image
      with:
        DOCKERFILE_PATH: ${{ inputs.DOCKERFILE }}
        DOCKERFILE_TARGET: ${{ inputs.DOCKERFILE_TARGET }}
        PIMCORE_ROOT: ${{ inputs.PIMCORE_ROOT }}
        BUILD_TIME_ARGS: ${{ inputs.BUILD_TIME_ARGS }}
        BUILD_TIME_SECRETS: ${{ inputs.BUILD_TIME_SECRETS }}
        PIMCORE_ENTERPRISE_TOKEN: ${{ inputs.PIMCORE_ENTERPRISE_TOKEN }}
        PIMCORE_PRODUCT_KEY: ${{ inputs.PIMCORE_PRODUCT_KEY }}
        PIMCORE_INSTANCE_IDENTIFIER: ${{ inputs.PIMCORE_INSTANCE_IDENTIFIER }}
        PIMCORE_ENCRYPTION_SECRET: ${{ inputs.PIMCORE_ENCRYPTION_SECRET }}
        TORQ_GITHUB_TOKEN: ${{ inputs.TORQ_GITHUB_TOKEN }}
        PUSH: "false"
        LOAD: "true"
        TAGS: "phpstan:test"

    - name: Run PHPStan
      shell: bash
      run: |
        set -Eeuo pipefail

        docker run --rm \
          --entrypoint /bin/bash \
          phpstan:test \
          -c '
            set -Eeuo pipefail

            if [ "$(id -u)" -eq 0 ]; then
              RUN_AS="runuser -u www-data --"
            else
              RUN_AS=""
            fi

            if [ ! -f "/var/www/html/phpstan.neon" ] && [ ! -f "/var/www/html/phpstan.neon.dist" ] && [ ! -f "/var/www/html/phpstan.dist.neon" ]; then
              echo "No phpstan.neon(.dist) file found in the project - skipping PHPStan analysis"
              exit 0
            fi

            if [ ! -f "/var/www/html/vendor/bin/phpstan" ]; then
              echo "PHPStan not found in vendor/bin - installing it..."
              $RUN_AS composer require --working-dir=/var/www/html --dev phpstan/phpstan --no-scripts
            fi

            # Data Object classes are normally generated during the Docker image build, but generate them
            # here too in case a project builds them at runtime instead - no database connection is required.
            if [ ! -d "/var/www/html/var/classes/DataObject" ] || [ -z "$(ls -A /var/www/html/var/classes/DataObject 2>/dev/null)" ]; then
              echo "Building Data Object classes..."
              export DATABASE_HOST=""
              export DATABASE_PORT=0
              export DATABASE_NAME=""
              export DATABASE_USER=""
              export DATABASE_SERVER_VERSION="0.0.0"
              export DATABASE_PASSWORD=""
              $RUN_AS /var/www/html/bin/console pimcore:build:classes
            fi

            echo "Running PHPStan..."
            $RUN_AS /var/www/html/vendor/bin/phpstan analyse --no-progress --error-format=github ${{ inputs.PHPSTAN_ARGS }}
            # phpstan will exit above with a non-zero code if it finds any issues
            echo "PHPStan found no issues!"
          '
