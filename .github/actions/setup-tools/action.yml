name: "Install tools"
description: "Installs tools required by workflows and actions"

runs: 
  using: "composite"
  steps:
    - name: Install jq
      uses: dcarbone/install-jq-action@4fcb5062d7ce9bc4382d1a352d19ba3ba2c317c1 # v4.0.1
      with:
        version: "1.7"

    - name: Determine PHP version
      id: get-php-version
      shell: bash
      run: |
        set -e

        version=""
        
        # Try to detect PHP version from Dockerfile
        dockerfile_path=""
        if [ -f .docker/Dockerfile ]; then
          dockerfile_path=".docker/Dockerfile"
        elif [ -f docker/Dockerfile ]; then
          dockerfile_path="docker/Dockerfile"
        elif [ -f docker/php-fpm/Dockerfile ]; then
          dockerfile_path="docker/php-fpm/Dockerfile"
        elif [ -f docker/php/Dockerfile ]; then
          dockerfile_path="docker/php/Dockerfile"
        fi
        if [ -n "$dockerfile_path" ]; then
          echo "Checking $dockerfile_path for PHP version..."
          version=$(grep -Eio '(php[:-])?[0-9]+\.[0-9]+' "$dockerfile_path" | head -1 | grep -Eo '[0-9]+\.[0-9]+') || true
          if [ -n "$version" ]; then
            echo "Found PHP version $version in $dockerfile_path"
          else
            echo "No PHP version found in $dockerfile_path"
          fi
        fi

        # Fallback to default if version could not be found in Dockerfile
        version=${version:-8.4}

        echo "Using PHP version: $version"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: ${{ steps.get-php-version.outputs.version }}